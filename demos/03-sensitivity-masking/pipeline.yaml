name: expanso-edge-categorization-sensitivity-masking
type: pipeline
description: Semantic sensitivity classifier with Expanso Edge Categorization — every record gets a sensitivity class and PII/credential judgment at the edge, then the matching masking policy is applied before data leaves the source.
namespace: production
labels:
  category: data-security
  pattern: ai-decision
  model: expanso-edge-categorization

config:
  input:
    http_server:
      address: "${INGEST_ADDRESS:127.0.0.1:8080}"
      path: /records
      allowed_verbs: ["POST"]

  pipeline:
    processors:
      - label: parse_body
        mapping: |
          # http_server already parses JSON bodies; only parse raw strings
          root = if this.type() == "string" { this.parse_json() } else { this }

      - label: stamp_received
        mapping: |
          root = this
          root.received_at = now()

      # ── Ask Jev: what is this record, semantically? ──
      - label: start_timer
        mutation: |
          meta categorization_start = timestamp_unix_milli()

      - label: ask_categorization
        branch:
          request_map: |
            root = {
              "state": this.string(),
              "model": "jev-latest",
              "questions": {
                "sensitivity": {
                  "type": "choice",
                  "instructions": "What is the sensitivity class of this record?",
                  "criteria": {
                    "public": "Safe to share broadly, no personal or secret data",
                    "internal": "Company-internal, not for external sharing",
                    "confidential": "Sensitive business or personal data, restricted distribution",
                    "restricted": "Highly sensitive: records under legal or contractual restriction, secrets, legal hold"
                  }
                },
                "contains_pii": {
                  "type": "noul",
                  "instructions": "Does this record contain personally identifiable information (names, emails, SSNs, addresses, phone numbers)?"
                },
                "contains_credentials": {
                  "type": "noul",
                  "instructions": "Does this record contain passwords, API keys, tokens, or other secrets?"
                }
              }
            }
          processors:
            - http:
                url: "${JEV_API_URL:http://127.0.0.1:8099/v1/systemone}"
                verb: POST
                headers:
                  Content-Type: application/json
                  Authorization: "Bearer ${TYPESAFE_API_KEY:unset}"
                timeout: 2s
                retries: 1
            - catch:
              - mapping: |
                  root = {"answers": {}, "model": "categorization-unavailable"}
          result_map: |
            root.categorization = {
              "answers": this.answers,
              "model": this.model.or("jev-latest"),
              "ms": timestamp_unix_milli() - metadata("categorization_start")
            }

      # ── Pick the policy Jev's judgment calls for ──
      - label: pick_policy
        mapping: |
          root = this
          let sens = this.categorization.answers.sensitivity.choice.or("internal")
          let pii = this.categorization.answers.contains_pii.noul.or(0)
          let creds = this.categorization.answers.contains_credentials.noul.or(0)

          # Fail closed: when Jev did not answer, nothing leaves unmasked.
          let categorization_up = this.categorization.model.or("") != "categorization-unavailable"

          root.categorization_decision = if !$categorization_up || $creds >= 0.7 || $sens == "restricted" {
            "quarantine"
          } else if $sens == "confidential" {
            "tokenize"
          } else if $pii >= 0.5 {
            "mask"
          } else {
            "pass"
          }

      # ── Apply the policy before data leaves the source ──
      - label: apply_policy
        mapping: |
          root = this
          root.email = if this.categorization_decision == "tokenize" {
            this.email.or("").hash("sha256").encode("hex")
          } else if this.categorization_decision == "mask" {
            "MASKED"
          } else {
            this.email
          }
          root.ssn = if this.categorization_decision == "tokenize" {
            this.ssn.or("").hash("sha256").encode("hex")
          } else if this.categorization_decision == "mask" || this.categorization_decision == "quarantine" {
            "MASKED"
          } else {
            this.ssn
          }
          root.api_key = if this.categorization_decision == "quarantine" {
            "QUARANTINED"
          } else {
            this.api_key
          }
          root.policy_applied = this.categorization_decision

  output:
    broker:
      pattern: fan_out
      outputs:
        - label: echo_stdout
          stdout:
            codec: lines
        - label: by_decision
          switch:
            cases:
              - check: this.categorization_decision == "quarantine"
                output:
                  label: quarantine
                  file:
                    path: ./data/expanso-edge-categorization-sensitivity-masking/quarantine-${! now().ts_format("2006-01-02") }.jsonl
                    codec: lines
              - check: "true"
                output:
                  label: forwarded
                  file:
                    path: ./data/expanso-edge-categorization-sensitivity-masking/forwarded-${! now().ts_format("2006-01-02") }.jsonl
                    codec: lines
