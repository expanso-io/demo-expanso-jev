<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../01-log-triage/fonts/fonts.css">
<title>Data quality firewall: step explorer</title>
<style>
:root{
  color-scheme:light;
  --bg:#f6f4fa; --surface:#ffffff; --code:#eeebf5; --text:#1b1530; --muted:#4d4666;
  --line:#8c82a8; --soft:#d6d0e4;
  --link:#5224c4; --btn-bg:#5224c4; --btn-text:#ffffff;
  --ok:#0f6b32; --err:#a3202c;
  --k:#5224c4; --s:#0b5f46; --n:#8a3f00; --p:#4d4666;
  --add:#d3efdb; --chg:#f8e3a8;
  --sans:"IBM Plex Sans",sans-serif; --mono:"IBM Plex Mono",monospace;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#12101c; --surface:#1b1729; --code:#0e0c16; --text:#ece8f7; --muted:#bdb5d3;
  --line:#8a80a6; --soft:#3a3452;
  --link:#c0acff; --btn-bg:#c0acff; --btn-text:#12101c;
  --ok:#74d894; --err:#ff9aa2;
  --k:#c0acff; --s:#7fdcb5; --n:#ffb36b; --p:#bdb5d3;
  --add:#1c3a29; --chg:#47390f;
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;overflow-anchor:none}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--sans);overflow-wrap:anywhere}
a{color:var(--link);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 64px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 0}
.top a{font-weight:500}
h1{font:600 clamp(28px,5vw,44px)/1.1 var(--sans);letter-spacing:-.01em;margin:16px 0 12px}
h2{font:600 26px/1.2 var(--sans);margin:48px 0 12px}
h3{font:600 18px/1.3 var(--sans);margin:24px 0 8px}
p{margin:0 0 12px;max-width:72ch}
.lede{font-size:19px;line-height:1.5;max-width:68ch}
.muted{color:var(--muted)}
code{font:14px/1.4 var(--mono);background:var(--code);padding:1px 5px;border-radius:4px}
button{font:500 15px/1.2 var(--sans);color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:11px 14px;min-height:44px;cursor:pointer}
button:hover{border-color:var(--text)}
button.primary{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg)}
button[aria-pressed=true],button[aria-current=step],button[aria-selected=true]{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg)}
button:disabled{cursor:not-allowed;color:var(--muted);border-color:var(--soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.status{font-size:14px;min-height:20px;color:var(--muted)}
.status.ok{color:var(--ok)} .status.err{color:var(--err)}
.panel{background:var(--surface);border:1px solid var(--soft);border-radius:8px;padding:16px;margin:12px 0}
.group{margin:16px 0}
.group>.label{font:600 15px/1.3 var(--sans);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{text-align:left;font-size:14px}
.chips button .dest{display:block;font-weight:400;font-size:13px}
.stagebar{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.stagebar button{min-width:44px}
.pager{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0}
.pager .where{font-weight:600;margin:0 8px}
.io{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:900px){.io.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.io h4{font:600 15px/1.3 var(--sans);margin:0 0 6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
pre{margin:0;padding:12px;background:var(--code);border:1px solid var(--soft);border-radius:6px;font:14px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;color:var(--text)}
.json .ln{display:block;padding-left:2ch;text-indent:-2ch}
.json .ln.add{background:var(--add)} .json .ln.chg{background:var(--chg)}
.json .m{display:inline-block;width:2ch;text-indent:0;color:var(--muted)}
.tk{color:var(--k)} .ts{color:var(--s)} .tn{color:var(--n)} .tp{color:var(--p)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.legend{font-size:14px;color:var(--muted);margin:8px 0}
dl.qs{margin:0;display:grid;gap:8px}
dl.qs dt{font:500 14px/1.4 var(--mono)}
dl.qs dd{margin:0 0 4px;font-size:15px}
.cmd{margin:12px 0}
.cmd .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.files{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.file{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--soft);padding-bottom:12px}
.file .name{font:500 15px var(--mono)}
.note{background:var(--surface);border:1px solid var(--soft);border-radius:8px;padding:12px 16px}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--soft);font-size:14px;color:var(--muted)}
ul.plain{margin:0 0 12px;padding-left:20px;max-width:72ch}
</style>
</head>

<script id="data" type="application/json">{"id":"08-data-quality","title":"Data quality firewall","lede":"Rows headed for the warehouse are judged for quality and schema conformance at the edge. Bad rows are quarantined with the judgment attached; good rows flow through.","points":["Jev is asked 2 questions about each record: conformant, quality.","Every record ends in one place: Quarantine, Warehouse.","If Jev cannot be reached: Every row is quarantined. The quality score reads as 0, so nothing reaches the warehouse unjudged."],"explore_intro":"Pick a record, then page through the stages with the buttons or the Left and Right arrow keys. Every value below was captured from a real run of the pipeline in this repository: the message after each processor, the request to Jev, and its answer.","cases":[{"id":"main","scenario":"Jev answering","note":null,"stages":[{"title":"The input","text":"The record as the pipeline's HTTP input received it: a POST to /rows with this JSON body. Nothing has touched it yet.","source":"input:\n  http_server:\n    address: \"${INGEST_ADDRESS:127.0.0.1:8080}\"\n    path: /rows\n    allowed_verbs: [\"POST\"]"},{"title":"Parse the body","text":"The input already parses JSON bodies. This stage only parses a body that arrives as a string, so both shapes become the same object before anything else touches it.","source":"- label: parse_body\n  mapping: |\n    # http_server already parses JSON bodies; only parse raw strings\n    root = if this.type() == \"string\" { this.parse_json() } else { this }"},{"title":"Stamp the arrival time","text":"Adds received_at, the time this node first saw the record. Everything downstream, including the latency figure, is measured from here.","source":"- label: stamp_received\n  mapping: |\n    root = this\n    root.received_at = now()"},{"title":"Start the latency timer","text":"Stores the current time in message metadata. The message itself does not change, so the output below equals the input; the timer is read after Jev answers.","source":"- label: start_timer\n  mutation: |\n    meta jev_start = timestamp_unix_milli()"},{"title":"Ask Jev","text":"One request carries the record and the questions below. The answer is merged under `jev` with the model name and the round trip in milliseconds. If Jev cannot be reached, the catch block substitutes an empty answer set and every rule below falls to its default branch, so nothing is guessed.","source":"- label: ask_jev\n  branch:\n    request_map: |\n      root = {\n        \"state\": this.string(),\n        \"model\": \"jev-latest\",\n        \"questions\": {\n          \"quality\": {\n            \"type\": \"score\",\n            \"instructions\": \"Rate the data quality of this row for analytics use.\",\n            \"criteria\": [\n              \"Corrupt or unusable\",\n              \"Poor, major issues\",\n              \"Acceptable with caveats\",\n              \"Good, minor issues only\",\n              \"Pristine\"\n            ]\n          },\n          \"conformant\": {\n            \"type\": \"noul\",\n            \"instructions\": \"Does this row conform to the expected schema and plausible value ranges? Expected: order_id (string), customer_id (string), amount (positive number), currency (3-letter code), ts (ISO timestamp).\"\n          }\n        }\n      }\n    processors:\n      - http:\n          url: \"${JEV_API_URL:https://api.typesafe.ai/v1/systemone}\"\n          verb: POST\n          headers:\n            Content-Type: application/json\n            Authorization: \"Bearer ${TYPESAFE_API_KEY}\"\n          timeout: 2s\n          retries: 1\n      - catch:\n        - mapping: |\n            root = {\"answers\": {}, \"model\": \"jev-unavailable\"}\n    result_map: |\n      root.jev = {\n        \"answers\": this.answers,\n        \"model\": this.model.or(\"jev-latest\"),\n        \"ms\": timestamp_unix_milli() - metadata(\"jev_start\")\n      }","jev":true},{"title":"Decide where it goes","text":"A quality score under 1, or a conformance likelihood under 0.3, quarantines the row. Everything else goes to the warehouse.","source":"- label: route_decision\n  mapping: |\n    root = this\n    let quality = this.jev.answers.quality.score.or(0)\n    let conformant = this.jev.answers.conformant.noul.or(0)\n\n    root.jev_decision = if $quality < 1 || $conformant < 0.3 {\n      \"quarantine\"\n    } else {\n      \"warehouse\"\n    }"},{"title":"Write to a queue","text":"Quarantine and warehouse are separate JSONL files under data/jev-data-quality/.","source":"output:\n  broker:\n    pattern: fan_out\n    outputs:\n      - label: echo_stdout\n        stdout:\n          codec: lines\n      - label: by_decision\n        switch:\n          cases:\n            - check: this.jev_decision == \"quarantine\"\n              output:\n                label: quarantine\n                file:\n                  path: ./data/jev-data-quality/quarantine-${! now().ts_format(\"2006-01-02\") }.jsonl\n                  codec: lines\n            - check: \"true\"\n              output:\n                label: warehouse\n                file:\n                  path: ./data/jev-data-quality/warehouse-${! now().ts_format(\"2006-01-02\") }.jsonl\n                  codec: lines"}],"queues":{"quarantine":"Quarantine","warehouse":"Warehouse"},"questions":[{"id":"conformant","type":"noul","instructions":"Does this row conform to the expected schema and plausible value ranges? Expected: order_id (string), customer_id (string), amount (positive number), currency (3-letter code), ts (ISO timestamp)."},{"id":"quality","type":"score","instructions":"Rate the data quality of this row for analytics use."}],"records":[{"label":"ord-9001","states":[{"order_id":"ord-9001","customer_id":"cus-88121","amount":129.99,"currency":"USD","ts":"2026-09-18T14:00:00Z"},{"amount":129.99,"currency":"USD","customer_id":"cus-88121","order_id":"ord-9001","ts":"2026-09-18T14:00:00Z"},{"amount":129.99,"currency":"USD","customer_id ues\",\n              \"Acceptable with caveats\",\n              \"Good, minor issues only\",\n              \"Pristine\"\n            ]\n          },\n          \"conformant\": {\n            \"type\": \"noul\",\n            \"instructions\": \"Does this row conform to the expected schema and plausible value ranges? Expected: order_id (string), customer_id (string), amount (positive number), currency (3-letter code), ts (ISO timestamp).\"\n          }\n        }\n      }\n    processors:\n      - http:\n          url: \"${JEV_API_URL:https://api.typesafe.ai/v1/systemone}\"\n          verb: POST\n          headers:\n            Content-Type: application/json\n            Authorization: \"Bearer ${TYPESAFE_API_KEY}\"\n          timeout: 2s\n          retries: 1\n      - catch:\n        - mapping: |\n            root = {\"answers\": {}, \"model\": \"jev-unavailable\"}\n    result_map: |\n      root.jev = {\n        \"answers\": this.answers,\n        \"model\": this.model.or(\"jev-latest\"),\n        \"ms\": timestamp_unix_milli() - metadata(\"jev_start\")\n      }","jev":true},{"title":"Decide where it goes","text":"A quality score under 1, or a conformance likelihood under 0.3, quarantines the row. Everything else goes to the warehouse.","source":"- label: route_decision\n  mapping: |\n    root = this\n    let quality = this.jev.answers.quality.score.or(0)\n    let conformant = this.jev.answers.conformant.noul.or(0)\n\n    root.jev_decision = if $quality < 1 || $conformant < 0.3 {\n      \"quarantine\"\n    } else {\n      \"warehouse\"\n    }"},{"title":"Write to a queue","text":"Quarantine and warehouse are separate JSONL files under data/jev-data-quality/.","source":"output:\n  broker:\n    pattern: fan_out\n    outputs:\n      - label: echo_stdout\n        stdout:\n          codec: lines\n      - label: by_decision\n        switch:\n          cases:\n            - check: this.jev_decision == \"quarantine\"\n              output:\n                label: quarantine\n                file:\n                  path: ./data/jev-data-quality/quarantine-${! now().ts_format(\"2006-01-02\") }.jsonl\n                  codec: lines\n            - check: \"true\"\n              output:\n                label: warehouse\n                file:\n                  path: ./data/jev-data-quality/warehouse-${! now().ts_format(\"2006-01-02\") }.jsonl\n                  codec: lines"}],"queues":{"quarantine":"Quarantine","warehouse":"Warehouse"},"questions":[{"id":"conformant","type":"noul","instructions":"Does this row conform to the expected schema and plausible value ranges? Expected: order_id (string), customer_id (string), amount (positive number), currency (3-letter code), ts (ISO timestamp)."},{"id":"quality","type":"score","instructions":"Rate the data quality of this row for analytics use."}],"records":[{"label":"ord-9001","states":[{"order_id":"ord-9001","customer_id":"cus-88121","amount":129.99,"currency":"USD","ts":"2026-09-18T14:00:00Z"},{"amount":129.99,"currency":"USD","customer_id":"cus-88121","order_id":"ord-9001","ts":"2026-09-18T14:00:00Z"},{"amount":129.99,"currency":"USD","customer_id":"cus-88121","order_id":"ord-9001","received_at":"2026-10-05T19:41:38.40086-07:00","ts":"2026-09-18T14:00:00Z"},{"amount":129.99,"currency":"USD","customer_id":"cus-88121","order_id":"ord-9001","received_at":"2026-10-05T19:41:38.40086-07:00","ts":"2026-09-18T14:00:00Z"},{"amount":129.99,"currency":"USD","customer_id":"cus-88121","jev":{"answers":{},"model":"jev-unavailable","ms":1004},"order_id":"ord-9001","received_at":"2026-10-05T19:41:38.40086-07:00","ts":"2026-09-18T14:00:00Z"},{"amount":129.99,"currency":"USD","customer_id":"cus-88121","jev":{"answers":{},"model":"jev-unavailable","ms":1004},"jev_decision":"quarantine","order_id":"ord-9001","received_at":"2026-10-05T19:41:38.40086-07:00","ts":"2026-09-18T14:00:00Z"}],"jev":[{"request":{"amount":129.99,"currency":"USD","customer_id":"cus-88121","order_id":"ord-9001","ts":"2026-09-18T14:00: 99.99,"currency":"US","customer_id":null,"order_id":"ord-9005","ts":"2026-09-18T14:04:00Z"},"questions":{"conformant":{"instructions":"Does this row conform to the expected schema and plausible value ranges? Expected: order_id (string), customer_id (string), amount (positive number), currency (3-letter code), ts (ISO timestamp).","type":"noul"},"quality":{"criteria":["Corrupt or unusable","Poor, major issues","Acceptable with caveats","Good, minor issues only","Pristine"],"instructions":"Rate the data quality of this row for analytics use.","type":"score"}},"response":{"status":503,"error":"Jev is unreachable"}}],"destination":"quarantine","dest_label":"Quarantine"}]}],"run":[{"title":"Run it with no account","intro":"The fixture runner deploys the pipeline exactly as shipped to a local Edge agent, posts every line of the input, and compares what the pipeline wrote with the expected output. It needs expanso-edge, expanso-cli and uv, and no Expanso Cloud credentials or Jev key.","commands":["uv run -s tools/fixture-runner.py run --only 08"],"after":"Each case prints pass or FAIL with the queues it wrote."},{"title":"Run it by hand","intro":"The same thing without the runner. The pipeline writes ./data in the agent's working directory, so start the agent in a scratch directory.","commands":["uv run shared/jev-mock-server.py &","mkdir -p /tmp/jev-08 && cd /tmp/jev-08","export TYPESAFE_API_KEY=local-only \\\n  JEV_API_URL=http://127.0.0.1:8099/v1/systemone \\\n  INGEST_ADDRESS=127.0.0.1:8080","expanso-edge run --local --no-watch &","export EXPANSO_CLI_ENDPOINT=http://localhost:9010","expanso-cli job deploy <repo>/demos/08-data-quality/pipeline.yaml","while read -r line; do \\\n  curl -s -X POST http://127.0.0.1:8080/rows -d \"$line\"; \\\ndone < <repo>/demos/08-data-quality/input.jsonl","cat data/jev-data-quality/*.jsonl","kill %1 %2"],"after":"Replace <repo> with the path to your clone. The mock answers with keyword rules; use your own Jev endpoint and key to see Jev's judgments."}],"deploy":[{"title":"Deploy it through Expanso Cloud","intro":"Pipelines here are deployed through Expanso Cloud and run by the Edge agent on your node. Credentials come from the environment, never from flags.","commands":["export EXPANSO_CLI_ENDPOINT=<your network endpoint>\nexport EXPANSO_CLI_AUTH_API_KEY=<your API key>","expanso-cli job deploy demos/08-data-quality/pipeline.yaml"],"after":"Set TYPESAFE_API_KEY in the environment of the Edge agent that runs the job. It never goes in the job file or in Expanso Cloud. Add a selector with match_labels to pin the job to specific nodes."},{"title":"Where it listens and where it writes","intro":"The input listens on 127.0.0.1:8080 unless INGEST_ADDRESS says otherwise. Put TLS and authentication in front of it before it accepts traffic from another host. Each queue is a JSONL file under the agent's working directory; to deliver somewhere else, replace that queue's file output with the output your system needs. The decision logic upstream does not change.","commands":[]}],"files":[{"name":"demos/08-data-quality/pipeline.yaml","text":"name: jev-data-quality\ntype: pipeline\ndescription: Data quality firewall with Jev — warehouse-bound rows are judged for quality and schema conformance at the edge. Bad rows quarantine with reasons attached; good rows flow through.\nnamespace: production\nlabels:\n  category: data-transformation\n  pattern: ai-decision\n  model: jev\n\nconfig:\n  input:\n    http_server:\n      address: \"${INGEST_ADDRESS:127.0.0.1:8080}\"\n      path: /rows\n      allowed_verbs: [\"POST\"]\n\n  pipeline:\n    processors:\n      - label: parse_body\n        mapping: |\n          # http_server already parses JSON bodies; only parse raw strings\n          root = if this.type() == \"string\" { this.parse_json() } else { this }\n\n      - label: stamp_received\n        mapping: |\n          root = this\n          root.received_at = now()\n\n      # ── Ask Jev ──\n      - label: start_timer\n        mutation: |\n          meta jev_start = timestamp_unix_milli()\n\n      - label: ask_jev\n        branch:\n          request_map: |\n            root = {\n              \"state\": this.string(),\n              \"model\": \"jev-latest\",\n              \"questions\": {\n                \"quality\": {\n                  \"type\": \"score\",\n                  \"instructions\": \"Rate the data quality of this row for analytics use.\",\n                  \"criteria\": [\n                    \"Corrupt or unusable\",\n                    \"Poor, major issues\",\n                    \"Acceptable with caveats\",\n                    \"Good, minor issues only\",\n                    \"Pristine\"\n                  ]\n                },\n                \"conformant\": {\n                  \"type\": \"noul\",\n                  \"instructions\": \"Does this row conform to the expected schema and plausible value ranges? Expected: order_id (string), customer_id (string), amount (positive number), currency (3-letter code), ts (ISO timestamp).\"\n                }\n              }\n            }\n          processors:\n            - http:\n                url: \"${JEV_API_URL:https://api.typesafe.ai/v1/systemone}\"\n                verb: POST\n                headers:\n                  Content-Type: application/json\n                  Authorization: \"Bearer ${TYPESAFE_API_KEY}\"\n                timeout: 2s\n                retries: 1\n            - catch:\n              - mapping: |\n                  root = {\"answers\": {}, \"model\": \"jev-unavailable\"}\n          result_map: |\n            root.jev = {\n              \"answers\": this.answers,\n              \"model\": this.model.or(\"jev-latest\"),\n              \"ms\": timestamp_unix_milli() - metadata(\"jev_start\")\n            }\n\n      # ── Confidence-gated cascade ──\n      - label: route_decision\n        mapping: |\n          root = this\n          let quality = this.jev.answers.quality.score.or(0)\n          let conformant = this.jev.answers.conformant.noul.or(0)\n\n          root.jev_decision = if $quality < 1 || $conformant < 0.3 {\n            \"quarantine\"\n          } else {\n            \"warehouse\"\n          }\n\n  output:\n    broker:\n      pattern: fan_out\n      outputs:\n        - label: echo_stdout\n          stdout:\n            codec: lines\n        - label: by_decision\n          switch:\n            cases:\n              - check: this.jev_decision == \"quarantine\"\n                output:\n                  label: quarantine\n                  file:\n                    path: ./data/jev-data-quality/quarantine-${! now().ts_format(\"2006-01-02\") }.jsonl\n                    codec: lines\n              - check: \"true\"\n                output:\n                  label: warehouse\n                  file:\n                    path: ./data/jev-data-quality/warehouse-${! now().ts_format(\"2006-01-02\") }.jsonl\n                    codec: lines\n","type":"application/x-yaml"},{"name":"demos/08-data-quality/input.jsonl","text":"{\"order_id\":\"ord-9001\",\"customer_id\":\"cus-88121\",\"amount\":129.99,\"currency\":\"USD\",\"ts\":\"2026-09-18T14:00:00Z\"}\n{\"order_id\":\"ord-9002\",\"customer_id\":\"cus-10422\",\"amount\":-45.00,\"currency\":\"USD\",\"ts\":\"2026-09-18T14:01:00Z\"}\n{\"order_id\":\"ord-9003\",\"customer_id\":null,\"amount\":\"a lot\",\"currency\":\"USDD\",\"ts\":\"yesterday-ish\"}\n{\"order_id\":\"ord-9004\",\"customer_id\":\"cus-77190\",\"amount\":9.99,\"currency\":\"USD\",\"ts\":\"2026-09-18T14:03:00Z\"}\n{\"order_id\": \"ord-9005\", \"customer_id\": null, \"amount\": 99999999.99, \"currency\": \"US\", \"ts\": \"2026-09-18T14:04:00Z\"}\n","type":"application/x-ndjson"},{"name":"demos/08-data-quality/fixtures/main.expected/quarantine.jsonl","text":"{\"amount\": -45.0, \"currency\": \"USD\", \"customer_id\": \"cus-10422\", \"jev\": {\"answers\": {\"conformant\": {\"noul\": 0.12, \"type\": \"noul\"}, \"quality\": {\"confidence\": 0.7, \"pr <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v !== null && v !== undefined) n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined) n.append(kid.nodeType ? kid : document.createTextNode(kid));
  return n;
};

/* ---------- theme: light unless the reader chose dark ---------- */
const root = document.documentElement;
function applyTheme(t) {
  root.setAttribute("data-theme", t);
  const b = $("#theme");
  b.setAttribute("aria-pressed", String(t === "dark"));
  b.textContent = t === "dark" ? "Light mode" : "Dark mode";
}
let saved = null;
try { saved = localStorage.getItem("jev-theme"); } catch (e) { saved = null; }
applyTheme(saved === "dark" ? "dark" : "light");
$("#theme").addEventListener("click", () => {
  const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("jev-theme", next); } catch (e) { /* the choice still applies for this visit */ }
});

/* ---------- feedback where the click happened ---------- */
function say(node, text, ok) {
  node.textContent = text;
  node.className = "status " + (ok ? "ok" : "err");
}
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall through */ }
  }
  const ta = el("textarea", { "aria-hidden": "true", tabindex: "-1" });
  ta.value = text;
  ta.style.cssText = "position:fixed;left:0;top:0;width:1px;height:1px;opacity:0";
  document.body.append(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}
function copyButton(label, getText, what) {
  const status = el("span", { class: "status", role: "status" });
  const b = el("button", { type: "button", onclick: async () => {
    const ok = await copyText(getText());
    say(status, ok ? "Copied " + what : "Copy failed. Select the text and copy it yourself.", ok);
  } }, label);
  return [b, status];
}
function downloadButton(file) {
  const status = el("span", { class: "status", role: "status" });
  const b = el("button", { type: "button", onclick: () => {
    try {
      const blob = new Blob([file.text], { type: file.type || "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = el("a", { href: url, download: file.name.split("/").pop() });
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      say(status, "Download started: " + file.name + " (" + blob.size + " bytes)", true);
    } catch (e) {
      say(status, "Download failed: " + (e && e.message ? e.message : "the browser refused it") + ". Use Copy and paste it into a file.", false);
    }
  } }, "Download");
  return [b, status];
}

/* ---------- JSON, one key per line, with what changed marked ---------- */
function mark(out, inn) {
  // returns a function (pathString) -> "add" | "chg" | ""
  const marks = new Map();
  (function walk(o, i, path, forced) {
    if (o && typeof o === "object") {
      const entries = Array.isArray(o) ? o.map((v, k) => [k, v]) : Object.entries(o);
      for (const [k, v] of entries) {
        const p = path + "/" + k;
        const iv = i && typeof i === "object" ? i[k] : undefined;
        if (forced || iv === undefined) { marks.set(p, "add"); walk(v, undefined, p, true); }
        else if (v && typeof v === "object" && iv && typeof iv === "object") walk(v, iv, p, false);
        else if (JSON.stringify(v) !== JSON.stringify(iv)) marks.set(p, "chg");
      }
    }
  })(out, inn, "", false);
  return marks;
}
function jsonLines(v, marks) {
  const lines = [];
  const push = (ind, parts, path, comma) => {
    const m = marks ? marks.get(path) || "" : "";
    lines.push({ ind, parts, m, comma });
  };
  const prim = (x) => {
    if (typeof x === "string") return [["ts", JSON.stringify(x)]];
    if (x === null) return [["tn", "null"]];
    return [["tn", String(x)]];
  };
  (function walk(x, ind, path, key, comma) {
    const head = key === null ? [] : [["tk", JSON.stringify(String(key))], ["tp", ": "]];
    if (x && typeof x === "object") {
      const arr = Array.isArray(x);
      const entries = arr ? x.map((val, k) => [k, val]) : Object.entries(x);
      if (!entries.length) { push(ind, [...head, ["tp", arr ? "[]" : "{}"]], path, comma); return; }
      push(ind, [...head, ["tp", arr ? "[" : "{"]], path, false);
      entries.forEach(([k, val], idx) => walk(val, ind + 1, path + "/" + k, arr ? null : k, idx < entries.length - 1));
      push(ind, [["tp", arr ? "]" : "}"]], path, comma);
    } else push(ind, [...head, ...prim(x)], path, comma);
  })(v, 0, "", null, false);
  return lines;
}
function jsonBlock(value, marks) {
  const pre = el("pre", { class: "json", tabindex: "0", "aria-label": "JSON" });
  for (const l of jsonLines(value, marks)) {
    const line = el("span", { class: "ln" + (l.m ? " " + l.m : "") });
    line.append(el("span", { class: "m", "aria-hidden": "true" }, l.m === "add" ? "+" : l.m === "chg" ? "~" : " "));
    if (l.m) line.append(el("span", { class: "vh" }, l.m === "add" ? "added: " : "changed: "));
    line.append(document.createTextNode("  ".repeat(l.ind)));
    for (const [cls, t] of l.parts) line.append(el("span", { class: cls }, t));
    if (l.comma) line.append(el("span", { class: "tp" }, ","));
    pre.append(line);
  }
  return pre;
}
const rich = (t) => String(t).split("`").map((seg, i) => i % 2 ? el("code", { text: seg }) : seg);
const parse = (s) => { try { return JSON.parse(s); } catch (e) { return s; } };
const pretty = (v) => typeof v === "string" ? v : JSON.stringify(v, null, 2);

/* ---------- page: explanation ---------- */
$("#title").textContent = D.title;
$("#lede").replaceChildren(...rich(D.lede));
(function what() {
  const box = $("#what");
  if (D.points && D.points.length) {
    box.append(el("h2", { text: "What it does" }));
    box.append(el("ul", { class: "plain" }, D.points.map((p) => el("li", {}, rich(p)))));
  }
  const c0 = D.cases[0];
  if (c0.questions && c0.questions.length) {
    box.append(el("h3", { text: "What Jev is asked" }));
    const dl = el("dl", { class: "qs" });
    for (const q of c0.questions) {
      dl.append(el("dt", { text: q.id + " (" + q.type + ")" }), el("dd", { text: q.instructions }));
    }
    box.append(dl);
  }
})();

/* ---------- page: the step explorer ---------- */
const st = { c: 0, r: 0, s: 0 };
function applyHash() {
  const m = Object.fromEntries(location.hash.slice(1).split("&").filter(Boolean).map((kv) => kv.split("=")));
  const c = D.cases.findIndex((x) => x.id === m.case);
  if (c >= 0) st.c = c;
  const cs = D.cases[st.c];
  if (m.record && +m.record >= 0 && +m.record < cs.records.length) st.r = +m.record;
  if (m.stage && +m.stage >= 0 && +m.stage < cs.stages.length) st.s = +m.stage;
}
applyHash();
$("#explore-intro").replaceChildren(...rich(D.explore_intro));
const explore = $("#explore");
const scenarioBox = el("div", { class: "group" });
const recordBox = el("div", { class: "group" });
const barBox = el("div", { class: "group" });
const pagerBox = el("div", { class: "pager" });
const panel = el("div", { class: "panel", "aria-live": "polite" });
explore.append(scenarioBox, recordBox, barBox, pagerBox, panel);

function cur() { return D.cases[st.c]; }
function save() {
  history.replaceState(null, "", "#case=" + cur().id + "&record=" + st.r + "&stage=" + st.s);
}
function renderScenarios() {
  scenarioBox.replaceChildren();
  if (D.cases.length < 2) return;
  scenarioBox.append(el("p", { class: "label", text: "Scenario" }));
  const row = el("div", { class: "chips", role: "group", "aria-label": "Scenario" });
  D.cases.forEach((c, i) => row.append(el("button", { type: "button", "aria-pressed": String(i === st.c), onclick: () => {
    st.c = i; st.r = Math.min(st.r, cur().records.length - 1); st.s = Math.min(st.s, cur().stages.length - 1); render();
  } }, c.scenario)));
  scenarioBox.append(row);
  if (cur().note) scenarioBox.append(el("p", { class: "muted", text: cur().note }));
}
function renderRecords() {
  recordBox.replaceChildren(el("p", { class: "label", text: "Record (pick one of the " + cur().records.length + " in the sample input)" }));
  const row = el("div", { class: "chips", role: "group", "aria-label": "Record" });
  cur().records.forEach((r, i) => row.append(el("button", { type: "button", "aria-pressed": String(i === st.r), onclick: () => { st.r = i; render(); } },
    (i + 1) + ". " + r.label, el("span", { class: "dest", text: r.dest_label }))));
  recordBox.append(row);
}
function renderBar() {
  barBox.replaceChildren(el("p", { class: "label", text: "Stage" }));
  const ol = el("ol", { class: "stagebar" });
  cur().stages.forEach((p, i) => ol.append(el("li", {}, el("button", { type: "button", title: p.title, "aria-label": "Stage " + (i + 1) + ": " + p.title,
    "aria-current": i === st.s ? "step" : false, onclick: () => { st.s = i; render(); } }, String(i + 1)))));
  barBox.append(ol);
}
function renderPager() {
  const c = cur();
  pagerBox.replaceChildren(
    el("button", { type: "button", disabled: st.s === 0, onclick: () => step(-1) }, "Previous stage"),
    el("span", { class: "where", text: "Stage " + (st.s + 1) + " of " + c.stages.length + ": " + c.stages[st.s].title }),
    el("button", { type: "button", disabled: st.s === c.stages.length - 1, onclick: () => step(1) }, "Next stage"),
    el("span", { class: "muted", text: "Left and Right arrow keys also page." }));
}
function ioBlock(title, value, marks) {
  const h = el("h4", {}, el("span", { text: title }));
  const [cb, cs] = copyButton("Copy", () => pretty(value), title.toLowerCase());
  h.append(el("span", { class: "row" }, cb, cs));
  return el("div", {}, h, typeof value === "string" ? el("pre", { text: value }) : jsonBlock(value, marks));
}
function renderPanel() {
  const c = cur(), rec = c.records[st.r], p = c.stages[st.s], N = c.stages.length;
  const states = rec.states; // index = number of processors already applied
  const last = N - 2;        // index of the last processor state
  panel.replaceChildren(el("h3", { text: "Stage " + (st.s + 1) + ": " + p.title }), el("p", {}, rich(p.text)));
  let input, output, io = el("div", { class: "io" });
  if (st.s === 0) {
    input = null; output = states[0];
    io.append(ioBlock("The record as it arrives", output, null));
  } else if (st.s === N - 1) {
    input = states[last]; output = null;
    io.append(ioBlock("The record that reaches the output", input, null));
    io.append(el("p", { class: "note", text: rec.destination
      ? "Written to the " + (c.queues[rec.destination] || rec.destination) + " queue (" + rec.destination + ")."
      : "Not written to any queue: an earlier stage removed this record." }));
  } else {
    input = states[st.s - 1]; output = states[st.s];
    io.classList.add("two");
    io.append(ioBlock("Goes in", input, null));
    if (output === undefined) io.append(el("p", { class: "note", text: "Nothing comes out: this stage removed the record." }));
    else io.append(ioBlock("Comes out", output, input && typeof input === "object" ? mark(output, input) : null));
    if (output !== undefined && JSON.stringify(output) === JSON.stringify(input)) {
      io.append(el("p", { class: "muted", text: "The message is unchanged by this stage." }));
    }
  }
  panel.append(io);
  if (output !== null && st.s > 0 && st.s < N - 1 && output !== undefined) {
    panel.append(el("p", { class: "legend", text: "In the right-hand block, + marks a field this stage added and ~ marks one it changed." }));
  }
  if (p.jev && rec.jev.length) {
    const call = rec.jev[rec.jev.length - 1];
    panel.append(el("h3", { text: "The call to Jev" }));
    const two = el("div", { class: "io two" });
    two.append(ioBlock("State sent to Jev", call.request, null));
    two.append(call.response && call.response.status
      ? el("div", {}, el("h4", {}, el("span", { text: "Jev's answer" })), el("p", { class: "note", text: "Jev did not answer (HTTP " + call.response.status + "). " + (rec.jev.length > 1 ? rec.jev.length + " attempts were made. " : "") + "The pipeline continued with an empty answer set." }))
      : ioBlock("Jev's answer", call.response, null));
    panel.append(two);
  } else if (p.jev) {
    panel.append(el("p", { class: "note", text: "Jev was not asked about this record: an earlier stage sent it straight to its destination with no model call." }));
  }
  if (p.source) {
    panel.append(el("h3", { text: "How this stage is written" }));
    const [cb, cs] = copyButton("Copy", () => p.source, "the stage source");
    panel.append(el("pre", { text: p.source }), el("div", { class: "row", style: "margin-top:8px" }, cb, cs));
  }
}
function render() { renderScenarios(); renderRecords(); renderBar(); renderPager(); renderPanel(); save(); }
function step(d) {
  const c = cur(), n = st.s + d;
  if (n < 0 || n >= c.stages.length) return;
  const y = window.scrollY, x = window.scrollX;
  st.s = n;
  renderBar(); renderPager(); renderPanel(); save();
  window.scrollTo(x, y); // paging replaces content in place; the page must not jump
}
document.addEventListener("keydown", (e) => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  const t = e.target;
  if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
  e.preventDefault();
  step(e.key === "ArrowRight" ? 1 : -1);
});
window.addEventListener("hashchange", () => { applyHash(); render(); });
render();

/* ---------- page: run and deploy ---------- */
function section(host, items) {
  for (const it of items) {
    host.append(el("h3", { text: it.title }));
    if (it.intro) host.append(el("p", {}, rich(it.intro)));
    for (const cmd of it.commands || []) {
      const wrap = el("div", { class: "cmd" });
      wrap.append(el("pre", { text: cmd }));
      const [cb, cs] = copyButton("Copy command", () => cmd, "the command");
      wrap.append(el("div", { class: "bar" }, cb, cs));
      host.append(wrap);
    }
    if (it.after) host.append(el("p", {}, rich(it.after)));
  }
}
section($("#run"), D.run);
section($("#deploy"), D.deploy);
for (const f of D.files) {
  const row = el("div", { class: "file" }, el("span", { class: "name", text: f.name }));
  const [db, ds] = downloadButton(f);
  const [cb, cs] = copyButton("Copy", () => f.text, f.name);
  row.append(el("span", { class: "row" }, db, ds, cb, cs));
  $("#files").append(row);
}
$("#foot").append(el("p", { text: D.provenance + " " }, D.report ? [el("a", { href: D.report, text: "Dated run report" }), "."] : ""));
</script>
