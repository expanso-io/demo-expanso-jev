<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../01-log-triage/fonts/fonts.css">
<title>Log triage: step explorer</title>
<style>
:root{
  color-scheme:light;
  --bg:#f6f4fa; --surface:#ffffff; --code:#eeebf5; --text:#1b1530; --muted:#4d4666;
  --line:#8c82a8; --soft:#d6d0e4;
  --link:#5224c4; --btn-bg:#5224c4; --btn-text:#ffffff;
  --ok:#0f6b32; --err:#a3202c;
  --k:#5224c4; --s:#0b5f46; --n:#8a3f00; --p:#4d4666;
  --add:#d3efdb; --chg:#f8e3a8;
  --sans:"IBM Plex Sans",sans-serif; --mono:"IBM Plex Mono",monospace;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#12101c; --surface:#1b1729; --code:#0e0c16; --text:#ece8f7; --muted:#bdb5d3;
  --line:#8a80a6; --soft:#3a3452;
  --link:#c0acff; --btn-bg:#c0acff; --btn-text:#12101c;
  --ok:#74d894; --err:#ff9aa2;
  --k:#c0acff; --s:#7fdcb5; --n:#ffb36b; --p:#bdb5d3;
  --add:#1c3a29; --chg:#47390f;
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;overflow-anchor:none}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--sans);overflow-wrap:anywhere}
a{color:var(--link);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 64px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 0}
.top a{font-weight:500}
h1{font:600 clamp(28px,5vw,44px)/1.1 var(--sans);letter-spacing:-.01em;margin:16px 0 12px}
h2{font:600 26px/1.2 var(--sans);margin:48px 0 12px}
h3{font:600 18px/1.3 var(--sans);margin:24px 0 8px}
p{margin:0 0 12px;max-width:72ch}
.lede{font-size:19px;line-height:1.5;max-width:68ch}
.muted{color:var(--muted)}
code{font:14px/1.4 var(--mono);background:var(--code);padding:1px 5px;border-radius:4px}
button{font:500 15px/1.2 var(--sans);color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:11px 14px;min-height:44px;cursor:pointer}
button:hover{border-color:var(--text)}
button.primary{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg)}
button[aria-pressed=true],button[aria-current=step],button[aria-selected=true]{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg)}
button:disabled{cursor:not-allowed;color:var(--muted);border-color:var(--soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.status{font-size:14px;min-height:20px;color:var(--muted)}
.status.ok{color:var(--ok)} .status.err{color:var(--err)}
.panel{background:var(--surface);border:1px solid var(--soft);border-radius:8px;padding:16px;margin:12px 0}
.group{margin:16px 0}
.group>.label{font:600 15px/1.3 var(--sans);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{text-align:left;font-size:14px}
.chips button .dest{display:block;font-weight:400;font-size:13px}
.stagebar{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.stagebar button{min-width:44px}
.pager{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0}
.pager .where{font-weight:600;margin:0 8px}
.io{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:900px){.io.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.io h4{font:600 15px/1.3 var(--sans);margin:0 0 6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
pre{margin:0;padding:12px;background:var(--code);border:1px solid var(--soft);border-radius:6px;font:14px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;color:var(--text)}
.json .ln{display:block;padding-left:2ch;text-indent:-2ch}
.json .ln.add{background:var(--add)} .json .ln.chg{background:var(--chg)}
.json .m{display:inline-block;width:2ch;text-indent:0;color:var(--muted)}
.tk{color:var(--k)} .ts{color:var(--s)} .tn{color:var(--n)} .tp{color:var(--p)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.legend{font-size:14px;color:var(--muted);margin:8px 0}
dl.qs{margin:0;display:grid;gap:8px}
dl.qs dt{font:500 14px/1.4 var(--mono)}
dl.qs dd{margin:0 0 4px;font-size:15px}
.cmd{margin:12px 0}
.cmd .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.files{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.file{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--soft);padding-bottom:12px}
.file .name{font:500 15px var(--mono)}
.note{background:var(--surface);border:1px solid var(--soft);border-radius:8px;padding:12px 16px}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--soft);font-size:14px;color:var(--muted)}
ul.plain{margin:0 0 12px;padding-left:20px;max-width:72ch}
</style>
</head>

<script id="data" type="application/json">{"id":"01-log-triage","title":"Log triage","lede":"Most log lines are routine and a rule can say so instantly. A few are not, and no rule you have written yet knows which. Expanso shapes, fingerprints and counts every record, sends known routine lines straight to the archive, and asks Jev only about what is left.","points":["Every record ends in one place: Archive."],"explore_intro":"Pick a record, then page through the stages with the buttons or the Left and Right arrow keys. Every value below was captured from a real run of the pipeline in this repository: the message after each processor, the request to Jev, and its answer.","cases":[{"id":"logging","scenario":"Expanso alone","note":null,"stages":[{"title":"The input","text":"The record as the pipeline's HTTP input received it: a POST to /logs with this JSON body. Nothing has touched it yet.","source":"input:\n  http_server:\n    address: \"0.0.0.0:${INGEST_PORT:8080}\"\n    path: /logs\n    allowed_verbs: [\"POST\"]\n    # The response is held until the event is written out, and a Jev\n    # judgment takes ~3.5s. At the 5s default a burst queues past the limit\n    # and the input answers 408 for events it then processes anyway -- the\n    # source counts them lost while they land in a bucket.\n    timeout: 30s"},{"title":"Shape and fingerprint","text":"Adds received_at, node_id and a fingerprint: the service plus the message with every number replaced by #. Also adds the baseline, what severity-only routing would have done with the same record.","source":"- label: shape_fingerprint\n  mapping: |\n    root = this\n    root.received_at = now()\n    root.node_id = env(\"NODE_ID\").or(\"edge-1\")\n    let norm = this.msg.lowercase().re_replace(\"[0-9]+\", \"#\").re_replace(\"[^a-z0-9 :/_.*#-]\", \"\").re_replace(\"\\\\s+\", \" \").trim()\n    root.fingerprint = this.service + \"::\" + $norm\n    # The named naive baseline, computed on the IDENTICAL input so the two\n    # can be compared record by record: route on severity alone.\n    root.baseline = if this.level == \"ERROR\" { \"page\" } else if this.level == \"WARN\" { \"notify\" } else { \"archive\" }"},{"title":"Count occurrences","text":"Asks the local counter (POST /track) how many times this fingerprint has been seen in the last 10 minutes and what was decided before. The answer is stored under recurrence.","source":"- label: track_recurrence\n  branch:\n    request_map: |\n      root = {\"fingerprint\": this.fingerprint}\n    processors:\n      - http:\n          url: http://127.0.0.1:8898/track\n          verb: POST\n          headers:\n            Content-Type: application/json\n    result_map: |\n      root.recurrence = this"},{"title":"Mark the route","text":"Records that Expanso, not a model, handled this record.","source":"- label: mark_routed\n  mapping: |\n    root = this\n    root.routed_by = \"expanso\""},{"title":"Prepare the log line","text":"Builds the operational log summary in message metadata. It carries closed-set values and hashes only, never the message text. The record itself does not change.","source":"- label: build_log_fields\n  mapping: |\n    # Only values from closed sets, generated ids, numbers and hashes leave the\n    # node. service / level / id come from the log producer and team /\n    # severity come back from a model: all are arbitrary strings, so each is\n    # checked against a closed allowlist and anything else is replaced, never\n    # passed through. Ids and fingerprints are hashed unconditionally.\n    let occ = this.recurrence.occurrence.number().catch(0)\n    let fp = this.fingerprint.string().hash(\"sha256\").encode(\"hex\").slice(0, 12)\n    let lvl = if [\"DEBUG\", \"INFO\", \"WARN\", \"ERROR\"].contains(this.level) { this.level } else { \"other\" }\n    let svc = if [\"api\", \"worker\", \"cache\", \"deploy\", \"db\", \"edge\", \"infra\", \"net\", \"auth\"].contains(this.service) { this.service } else { \"other\" }\n    # The id is producer-supplied, so it is ALWAYS hashed: a pattern such as\n    # ^evt-... would still admit \"evt-alice-smith\". sha256 so the same 12 hex\n    # chars can be recomputed from a local receipt to correlate the two:\n    #   hashlib.sha256(record[\"id\"].encode()).hexdigest()[:12]\n    let eid = this.id.string().hash(\"sha256\").encode(\"hex\").slice(0, 12)\n    let tail = \" event=\" + $eid + \" fp=\" + $fp + \" occ=\" + $occ.string() + \" svc=\" + $svc + \" lvl=\" + $lvl\n    meta log_kind = if $occ == 1 || $occ % 250 == 0 { \"archive\" } else { \"\" }\n    meta log_summary = \"triage archive -> ARCHIVE selected, output pending: structured and counted, no model in this pipeline (checkpoint: a fingerprint's first occurrence, then every 250th)\" + $tail\n    meta log_event = $eid"},{"title":"Write the log line","text":"Emits an Expanso Cloud log line on a fingerprint's first occurrence and on every 250th after it. The record itself does not change.","source":"- label: log_selection\n  switch:\n    - check: 'meta(\"log_kind\") == \"archive\"'\n      processors:\n        - log:\n            level: INFO\n            message: '${! meta(\"log_summary\") }'\n            fields_mapping: |\n              root.stage = \"select\"\n              root.outcome = \"archive_selected\"\n              root.destination = \"archive\"\n              root.event_id = meta(\"log_event\")\n              root.model_called = false\n              root.write_confirmed = false"},{"title":"Archive","text":"Every record is written, now structured and counted, to data/logs.jsonl. No model is in this pipeline.","source":"output:\n  file:\n    path: data/logs.jsonl\n    codec: lines"}],"queues":{"logs":"Archive"},"questions":[],"records":[{"label":"GET /health 200 2ms","states":[{"id":"evt-000001","ts":"2026-10-05T09:00:01Z","level":"INFO","service":"api","msg":"GET /health 200 2ms"},{"baseline":"archive","fingerprint":"api::get /health # #ms","id":"evt-000001","level":"INFO","msg":"GET /health 200 2ms","node_id":"fixture-node","received_at":"2026-10-05T19:44:20.058389-07:00","service":"api","ts":"2026-10-05T09:00:01Z"},{"baseline":"archive","fingerprint":"api::get /health # #ms","id":"evt-000001","level":"INFO","msg":"GET /health 200 2ms","node_id":"fixture-node","received_at":"2026-10-05T19:44:20.058389-07:00","recurrence":{"first_seen_ago_s":0,"occurrence":1,"previous_decisions":[],"window_s":600},"service":"api","ts":"2026-10-05T09:00:01Z"},{"baseline":"archive","fingerprint":"api::get /health # #ms","id":"evt-000001","level":"INFO","msg":"GET /health 200 2ms","node_id":"fixture-node","received_at":"2026-10-05T19:44:20.058389-07:00","recurrence":{"first_seen_ago_s":0,"occurrence":1,"previous_decisions":[],"window_s":600},"routed_by":"expanso","service":"api","ts":"2026-10-05T09:00:01Z"},{"baseline":"archive","fingerprint":"api::get /health # #ms","id":"evt-000001","level":"INFO","msg":"GET /health 200 2ms","node_id":"fixture-node","received_at":"2026-10-05T19:44:20.058389-07:00","recurrence":{"first_seen_ago_s":0,"occurrence":1,"previous_decisions":[],"window_s":600},"routed_by":"expanso","service":"api","ts":"2026-10-05T09:00:01Z"},{"baseline":"archive","fingerprint":"api::get /health # #ms","id":"evt-000001","level":"INFO","msg":"GET /health 200 2ms","node_id":"fixture-node","received_at":"2026-10-05T19:44:20.058389-07:00","recurrence":{"first_seen_ago_s":0,"occurrence":1,"previous_decisions":[],"window_s":600},"routed_by":"expanso","service":"api","ts":"2026-10-05T09:00:01Z"}],"jev":[],"destination":"logs","dest_label":"Archive"},{"label":"GET /metrics 200 5ms","states":[{"id":"evt-000002","ts":"2026-10-05T09:00:02Z","level":"INFO","service":"api","msg":"GET /metrics 200 5ms"},{"baseline":"archive","fingerprint":"api::get /metrics # #ms","id":"evt-000002","level":"INFO","msg":"GET /metrics 200 5ms","node_id":"fixture-node","received_at":"2026-10-05T19:44:20.063765-07:00","service":"api","ts":"2026-10-05T09:00:02Z"},{"baseline":"archive","fingerprint": ours, renewal failed twice","node_id":"fixture-node","received_at":"2026-10-05T19:44:20.115636-07:00","recurrence":{"first_seen_ago_s":0,"occurrence":1,"previous_decisions":[],"window_s":600},"routed_by":"expanso","service":"edge","ts":"2026-10-05T09:00:14Z"}],"jev":[],"destination":"logs","dest_label":"Archive"},{"label":"rollout step 3/8 complete service...","states":[{"id":"evt-000015","ts":"2026-10-05T09:00:15Z","level":"INFO","service":"deploy","msg":"rollout step 3/8 complete service=checkout"},{"baseline":"archive","fingerprint":"deploy::rollout step #/# complete servicecheckout","id":"evt-000015","level":"INFO","msg":"rollout step 3/8 complete service=checkout","node_id":"fixture-node","received_at":"2026-10-05T19:44:20.119832-07:00","service":"deploy","ts":"2026-10-05T09:00:15Z"},{"baseline":"archive","fingerprint":"deploy::rollout step #/# complete servicecheckout","id":"evt-000015","level":"INFO","msg":"rollout step 3/8 complete service=checkout","node_id":"fixture-node","received_at":"2026-10-05T19:44:20.119832-07:00","recurrence":{"first_seen_ago_s":0,"occurrence":1,"previous_decisions":[],"window_s":600},"service":"deploy","ts":"2026-10-05T09:00:15Z"},{"baseline":"archive","fingerprint":"deploy::rollout step #/# complete servicecheckout","id":"evt-000015","level":"INFO","msg":"rollout step 3/8 complete service=checkout","node_id":"fixture-node","received_at":"2026-10-05T19:44:20.119832-07:00","recurrence":{"first_seen_ago_s":0,"occurrence":1,"previous_decisions":[],"window_s":600},"routed_by":"expanso","service":"deploy","ts":"2026-10-05T09:00:15Z"},{"baseline":"archive","fingerprint":"deploy::rollout step #/# complete servicecheckout","id":"evt-000015","level":"INFO","msg":"rollout step 3/8 complete service=checkout","node_id":"fixture-node","received_at":"2026-10-05T19:44:20.119832-07:00","recurrence":{"first_seen_ago_s":0,"occurrence":1,"previous_decisions":[],"window_s":600},"routed_by":"expanso","service":"deploy","ts":"2026-10-05T09:00:15Z"},{"baseline":"archive","fingerprint":"deploy::rollout step #/# complete servicecheckout","id":"evt-000015","level":"INFO","msg":"rollout step 3/8 complete service=checkout","node_id":"fixture-node","received_at":"2026-10-05T19:44:20.119832-07:00","recurrence":{"first_seen_ago_s":0,"occurrence":1,"previous_decisions":[],"window_s":600},"routed_by":"expanso","service":"deploy","ts":"2026-10-05T09:00:15Z"}],"jev":[],"destination":"logs","dest_label":"Archive"},{"label":"cache hit rate 0.01 window=5m","states":[{"id":"evt-000016","ts":"2026-10-05T09:00:16Z","level":"INFO","service":"cache","msg":"cache hit rate 0.01 window=5m"},{"baseline":"archive","fingerprint":"cache::cache hit rate #.# window#m","id":"evt-000016","level":"INFO","msg":"cache hit rate 0.01 window=5m","node_id":"fixture-node","received_at":"2026-10-05T19:44:20.124219-07:00","service":"cache","ts":"2026-10-05T09:00:16Z"},{"baseline":"archive","fingerprint":"cache::cache hit rate #.# window#m","id":"evt-000016","level":"INFO","msg":"cache hit rate 0.01 window=5m","node_id":"fixture-node","received_at":"2026-10-05T19:44:20.124219-07:00","recurrence":{"first_seen_ago_s":0,"occurrence":2,"previous_decisions":[],"window_s":600},"service":"cache","ts":"2026-10-05T09:00:16Z"},{"baseline":"archive","fingerprint":"cache::cache hit rate #.# window#m","id":"evt-000016","level":"INFO","msg":"cache hit rate 0.01 window=5m","node_id":"fixture-node","received_at":"2026-10-05T19:44:20.124219-07:00","recurrence":{"first_seen_ago_s":0,"occurrence":2,"previous_decisions":[],"window_s":600},"routed_by":"expanso","service":"cache","ts":"2026-10-05T09:00:16Z"},{"baseline":"archive","fingerprint":"cache::cache hit rate #.# window#m","id":"evt-000016","level":"INFO","msg":"cache hit rate 0.01 window=5m","node_id":"fixture-node","received_at":"2026-10-05T19:44:20.124219-07:00","recurrence":{"first_seen_ago_s":0,"occurrence":2,"previous_decisions":[],"window_s":600},"routed_by":"expanso","service":"cache","ts":"2026-10-05T09:00:16Z"},{"baseline":"archive","fingerprint":"cache::cache hit rate #.# window#m","id":"evt-000016","level":"INFO","msg":"cache hit rate 0.01 window=5m","node_id":"fixture-node","received_at":"2026-10-05T19:44:20.124219-07:00","recurrence":{"first_seen_ago_s":0,"occurrence":2,"previous_decisions":[],"window_s":600},"routed_by":"expanso","service":"cache","ts":"2026-10-05T09:00:16Z"}],"jev":[],"destination":"logs","dest_label":"Archive"}]},{"id":"recurrence","scenario":"Expanso and Jev","note":null,"stages":[{"title":"The input","text":"The record as the pipeline's HTTP input received it: a POST to /logs with this JSON body. Nothing has touched it yet.","source":"input:\n  http_server:\n    address: \"0.0.0.0:${INGEST_PORT:8080}\"\n    path: /logs\n    allowed_verbs: [\"POST\"]\n    # The response is held until the event is written out, and a Jev\n    # judgment takes ~3.5s. At the 5s default a burst queues past the limit\n    # and the input answers 408 for events it then processes anyway -- the\n    # source counts them lost while they land in a bucket.\n    timeout: 30s"},{"title":"Wait if held","text":"A record coming back from a hold waits 2 to 4 seconds, jittered so a recovery is not a stampede. First arrivals pass through untouched.","source":"- label: hold_wait\n  switch:\n    - check: 'this.held_attempts.number().catch(0) > 0'\n      processors:\n        - sleep:\n            duration: '${! (2000 + random_int(max: 2000)).string() + \"ms\" }'"},{"title":"Shape and fingerprint","text":"Adds received_at, node_id, the fingerprint, held_attempts (coerced to a whole number at least 0) and the severity-only baseline.","source":"- label: shape_fingerprint\n  mapping: |\n    root = this\n    root.received_at = this.received_at.or(now())   # a held record keeps its first arrival time\n    # Producer-supplied on first arrival, so never trusted as-is: coerce to a\n    # non-negative whole number. (A producer claiming 15 only skips its own hold.)\n    let ha = this.held_attempts.number().catch(0).floor()\n    root.held_attempts = if $ha < 0 { 0 } else { $ha }\n    root.node_id = env(\"NODE_ID\").or(\"edge-1\")\n    let norm = this.msg.lowercase().re_replace(\"[0-9]+\", \"#\").re_replace(\"[^a-z0-9 :/_.*#-]\", \"\").re_replace(\"\\\\s+\", \" \").trim()\n    root.fingerprint = this.service + \"::\" + $norm\n    # The named naive baseline, computed on the IDENTICAL input so the two\n    # can be compared record by record: route on severity alone.\n    root.baseline = if this.level == \"ERROR\" { \"page\" } else if this.level == \"WARN\" { \"notify\" } else { \"archive\" }"},{"title":"Count occurrences","text":"First arrival only: asks the counter how many times this fingerprint has been seen in 10 minutes and what was decided before. A held record is the same event, so it is not counted again.","source":"- label: track_recurrence\n  switch:\n    - check: 'this.held_attempts == 0'\n      processors:\n      - branch:\n          request_map: |\n            root = {\"fingerprint\": this.fingerprint}\n          processors:\n            - http:\n                url: http://127.0.0.1:8898/track\n                verb: POST\n                headers:\n                  Content-Type: application/json\n          result_map: |\n            root.recurrence = this"},{"title":"Skip the model for routine lines","text":"An exact allowlist of level INFO, service and raw message. A match sets bypass and goes to the archive with no model call. Any changed number, any WARN or ERROR and any novel INFO line is judged.","source":"- label: bypass_check\n  mapping: |\n    root = this\n    let routine = [\n      \"api|GET /health 200 2ms\",\n      \"api|GET /metrics 200 5ms\",\n      \"worker|cron heartbeat ok job=nightly-rollup\",\n      \"cache|cache hit rate 0.94 window=5m\",\n      \"api|gc pause 12ms heap=1.2gb\",\n      \"db|connection pool idle 45/50\",\n      \"deploy|rollout step 3/8 complete service=checkout\",\n    ]\n    root.bypass = this.level == \"INFO\" && $routine.contains(this.service + \"|\" + this.msg)"},{"title":"Ask Jev","text":"For records that were not bypassed: one request with the record, its recurrence history and four questions (actionable, severity, team, recurrence concern). Bypassed records skip this stage. If Jev does not answer, the catch block marks the answer unavailable.","source":"- label: ask_jev\n  switch:\n    - check: '!this.bypass'\n      processors:\n      - branch:\n          request_map: |\n            root.state = {\n              \"log\": {\n                \"level\": this.level,\n                \"service\": this.service,\n                \"msg\": this.msg,\n              },\n              \"recurrence\": {\n                \"occurrence\": this.recurrence.occurrence,\n                \"window\": \"10 minutes\",\n                \"first_seen_seconds_ago\": this.recurrence.first_seen_ago_s,\n                \"previous_routing_decisions\": this.recurrence.previous_decisions,\n              },\n            }\n            root.model = \"jev-latest\"\n            root.questions = {\n              \"actionable\": {\n                \"type\": \"noul\",\n                \"instructions\": \"How actionable is this log for an on-call engineer RIGHT NOW, 0.0 to 1.0? Weigh recurrence heavily: a first, isolated occurrence of a benign-looking line is low. The SAME line repeating (occurrence 3 or more within 10 minutes) is much more concerning -- repeated auth failures suggest brute force, repeated restarts suggest a crash loop, repeated warnings suggest a degrading system. Escalate the score as occurrence count rises.\",\n              },\n              \"severity\": {\n                \"type\": \"choice\",\n                \"instructions\": \"Classify the severity of this log line.\",\n                \"choices\": [\"info\", \"warning\", \"critical\", \"other\"],\n                \"criteria\": {\n                  \"info\": \"Routine operational message, no action needed\",\n                  \"warning\": \"Needs attention soon but is not urgent\",\n                  \"critical\": \"Service-impacting right now, page someone\",\n                  \"other\": \"Does not fit the above\"\n                }\n              },\n              \"team\": {\n                \"type\": \"choice\",\n                \"instructions\": \"Which team owns this? backend = app/services, infra = hosts/network/kubernetes, data = pipelines/databases, security = auth/intrusion/certs.\",\n                \"choices\": [\"backend\", \"infra\", \"data\", \"security\", \"other\"],\n                \"criteria\": {\n                  \"backend\": \"Application code, APIs, services\",\n                  \"infra\": \"Hosts, network, Kubernetes, TLS\",\n                  \"data\": \"Databases, pipelines, warehouses\",\n                  \"security\": \"Authentication, intrusion, access control\",\n                  \"other\": \"Cannot tell from this event\"\n                }\n              },\n              \"recurrence_concern\": {\n                \"type\": \"noul\",\n                \"instructions\": \"How much does the RECURRENCE PATTERN alone elevate concern, 0.0 to 1.0? 0.0 = isolated occurrence, nothing to infer. 1.0 = clearly escalating pattern (e.g., repeated auth failures from one source, repeated crashes, warnings trending toward critical).\",\n              },\n            }\n          processors:\n            - http:\n                url: ${JEV_API_URL}\n                verb: POST\n                headers:\n                  Content-Type: application/json\n            - catch:\n                # Jev unreachable: degrade gracefully, everything goes to review\n                - mapping: |\n                    root = {\"model\": \"jev-unavailable\", \"answers\": {}}\n          result_map: |\n            root.jev = {\"answers\": this.answers, \"model\": this.model.or(\"jev-latest\")}\n            root.jev_ok = this.model != \"jev-unavailable\""},{"title":"Decide","text":"Bypass archives. No answer and fewer than 15 attempts holds. No answer after 15 attempts goes to review. Critical at confidence 0.85 or more pages. Actionable 0.7 or more at confidence 0.5 or more notifies. Confidence under 0.6, or actionable from 0.4 to under 0.7, goes to review. Everything else archives.","source":"- label: cascade\n  mapping: |\n    root = this\n    root.routed_by = if this.bypass { \"expanso-bypass\" } else { \"jev\" }\n    let actionable = this.jev.answers.actionable.noul.or(0)\n    let sev = this.jev.answers.severity.choice.or(\"other\")\n    let conf = this.jev.answers.severity.confidence.or(0)\n    root.jev_decision = if this.bypass {\n      \"archive\"\n    } else if !this.jev_ok && this.held_attempts < 15 {\n      # Jev did not answer. Do not guess and do not give up yet: hold the\n      # record and ask again. See the \"held\" output below.\n      \"held\"\n    } else if !this.jev_ok {\n      \"review\"   # 15 attempts, ~45 s: stop holding, hand it to a human\n    } else if $sev == \"critical\" && $conf >= 0.85 {\n      \"page\"\n    } else if $actionable >= 0.7 && $conf >= 0.5 {\n      \"notify\"\n    } else if $conf < 0.6 || ($actionable >= 0.4 && $actionable < 0.7) {\n      \"review\"\n    } else {\n      \"archive\"\n    }"},{"title":"Prepare the log line","text":"Builds the operational log summary in message metadata from closed sets and hashes. The record itself does not change.","source":"- label: build_log_fields\n  mapping: |\n    # Only values from closed sets, generated ids, numbers and hashes leave the\n    # node. service / level / id come from the log producer and team /\n    # severity come back from a model: all are arbitrary strings, so each is\n    # checked against a closed allowlist and anything else is replaced, never\n    # passed through. Ids and fingerprints are hashed unconditionally.\n    let occ = this.recurrence.occurrence.number().catch(0)\n    let fp = this.fingerprint.string().hash(\"sha256\").encode(\"hex\").slice(0, 12)\n    let lvl = if [\"DEBUG\", \"INFO\", \"WARN\", \"ERROR\"].contains(this.level) { this.level } else { \"other\" }\n    let svc = if [\"api\", \"worker\", \"cache\", \"deploy\", \"db\", \"edge\", \"infra\", \"net\", \"auth\"].contains(this.service) { this.service } else { \"other\" }\n    # The id is producer-supplied, so it is ALWAYS hashed: a pattern such as\n    # ^evt-... would still admit \"evt-alice-smith\". sha256 so the same 12 hex\n    # chars can be recomputed from a local receipt to correlate the two:\n    #   hashlib.sha256(record[\"id\"].encode()).hexdigest()[:12]\n    let eid = this.id.string().hash(\"sha256\").encode(\"hex\").slice(0, 12)\n    let tail = \" event=\" + $eid + \" fp=\" + $fp + \" occ=\" + $occ.string() + \" svc=\" + $svc + \" lvl=\" + $lvl\n    let a = this.jev.answers.or({})\n    let sev = if [\"info\", \"warning\", \"critical\", \"other\"].contains($a.severity.choice) { $a.severity.choice } else { \"invalid\" }\n    let team = if [\"backend\", \"infra\", \"data\", \"security\", \"other\"].contains($a.team.choice) { $a.team.choice } else { \"invalid\" }\n    let act = ($a.actionable.noul.number().catch(0) * 100).round() / 100\n    let conf = ($a.severity.confidence.number().catch(0) * 100).round() / 100\n    meta log_kind = if this.bypass {\n      if $occ == 1 || $occ % 250 == 0 { \"bypass\" } else { \"\" }\n    } else if this.jev_decision == \"held\" {\n      # one line when a record is FIRST held; its retries are not news\n      if this.held_attempts == 0 { \"held\" } else { \"\" }\n    } else if !this.jev_ok.or(false) {\n      \"fallback\"\n    } else {\n      \"judged\"\n    }\n    meta log_summary = if this.bypass {\n      \"triage bypass -> ARCHIVE selected, output pending: known-routine line, no model call (checkpoint: a fingerprint's first occurrence, then every 250th)\" + $tail\n    } else if this.jev_decision == \"held\" {\n      \"triage held -> HOLD selected, output pending: Jev gave no answer, nothing guessed; retrying every 2-4s, up to 15 attempts (severity-only baseline: \" + this.baseline + \")\" + $tail\n    } else if !this.jev_ok.or(false) {\n      \"triage fallback -> REVIEW selected, output pending: Jev gave no answer after \" + this.held_attempts.string() + \" attempts, nothing guessed (severity-only baseline: \" + this.baseline + \")\" + $tail\n    } else {\n      \"triage judged -> \" + this.jev_decision.uppercase() + \" selected, output pending: \" + (if this.held_attempts > 0 { \"released after \" + this.held_attempts.string() + \" held attempts; \" } else { \"\" }) + \"Jev reported actionable=\" + $act.string() + \" severity=\" + $sev + \" confidence=\" + $conf.string() + \" team=\" + $team + \" (severity-only baseline: \" + this.baseline + \")\" + $tail\n    }\n    meta log_event = $eid"},{"title":"Write the log line","text":"Logs every judged or held selection, and a bypass checkpoint on a fingerprint's first occurrence and every 250th. The record itself does not change.","source":"- label: log_selection\n  switch:\n    - check: 'meta(\"log_kind\") == \"fallback\" || meta(\"log_kind\") == \"held\"'\n      processors:\n        - log:\n            level: WARN\n            message: '${! meta(\"log_summary\") }'\n            fields_mapping: |\n              root.stage = \"select\"\n              root.outcome = meta(\"log_kind\") + \"_selected\"\n              root.held_attempts = this.held_attempts\n              root.destination = this.jev_decision\n              root.baseline = this.baseline\n              root.event_id = meta(\"log_event\")\n              root.write_confirmed = false\n    - check: 'meta(\"log_kind\") == \"judged\" || meta(\"log_kind\") == \"bypass\"'\n      processors:\n        - log:\n            level: INFO\n            message: '${! meta(\"log_summary\") }'\n            fields_mapping: |\n              root.stage = \"select\"\n              root.outcome = meta(\"log_kind\") + \"_\" + this.jev_decision + \"_selected\"\n              root.destination = this.jev_decision\n              root.baseline = this.baseline\n              root.event_id = meta(\"log_event\")\n              root.model_called = !this.bypass\n              root.write_confirmed = false"},{"title":"Record the decision","text":"Sends the decision to the counter (POST /record) so the next occurrence sees it in its history. Not done while a record is held.","source":"- label: record_decision\n  switch:\n    - check: 'this.jev_decision != \"held\"'\n      processors:\n      - branch:\n          request_map: |\n            root = {\"fingerprint\": this.fingerprint, \"decision\": this.jev_decision}\n          processors:\n            - http:\n                url: http://127.0.0.1:8898/record\n                verb: POST\n                headers:\n                  Content-Type: application/json"},{"title":"Route to a bucket","text":"A switch writes the record to page, notify, review or archive. A held record writes a receipt to held first, then is posted back to this pipeline's own input to ask again.","source":"output:\n  switch:\n    cases:\n      # HOLD. Jev did not answer, so the record is neither guessed nor dropped.\n      # First hold only: write one receipt, then fall through (`continue`) to...\n      - check: this.jev_decision == \"held\" && this.held_attempts == 0\n        continue: true\n        output:\n          file:\n            path: data/held.jsonl\n            codec: lines\n      # ...the loop: re-submit to this pipeline's own input with the attempt\n      # count raised. It waits at step 0, asks Jev again, and takes its real\n      # route on the pass where Jev answers. After 15 attempts the gate stops\n      # holding and sends it to review.\n      - check: this.jev_decision == \"held\"\n        output:\n          http_client:\n            url: http://127.0.0.1:${INGEST_PORT:8080}/logs\n            verb: POST\n            headers:\n              Content-Type: application/json\n            max_in_flight: 64\n          processors:\n            - mapping: |\n                root = this\n                root.held_attempts = this.held_attempts + 1\n      - check: this.jev_decision == \"page\"\n        output:\n          file:\n            path: data/page.jsonl\n            codec: lines\n      - check: this.jev_decision == \"notify\"\n        output:\n          file:\n            path: data/notify.jsonl\n            codec: lines\n      - check: this.jev_decision == \"review\"\n        output:\n          file:\n            path: data/review.jsonl\n            codec: lines\n      - check: \"true\"\n        output:\n          file:\n            path: data/archive.jsonl\n            codec: lines"}],"queues":{"page":"Page","notify":"Notify","review":"Review","archive":"Archive","held":"Held receipt"},"questions":[{"id":"actionable","type":"noul","instructions":"How actionable is this log for an on-call engineer RIGHT NOW, 0.0 to 1.0? Weigh recurrence heavily: a first, isolated occurrence of a benign-looking line is low. The SAME line repeating (occurrence 3 or more within 10 minutes) is much more concerning -- repeated auth failures suggest brute force, repeated restarts suggest a crash loop, repeated warnings suggest a degrading system. Escalate the score as occurrence count rises."},{"id":"recurrence_concern","type":"noul","instructions":"How much does the RECURRENCE PATTERN alone elevate concern, 0.0 to 1.0? 0.0 = isolated occurrence, nothing to infer. 1.0 = clearly escalating pattern (e.g., repeated auth failures from one source, repeated crashes, warnings trending toward critical)."},{"id":"severity","type":"choice","instructions":"Classify the severity of this log line."},{"id":"team","type":"choice","instructions":"Which team owns this? backend = app/services, infra = hosts/network/kubernetes, data = pipelines/databases, security = auth/intrusion/certs."}],"records":[{"label":"GET /health 200 2ms","states":[{"id":"evt-000001","ts":"2026-10-05T09:00:01Z","level":"INFO","service":"api","msg":"GET e"},"team":{"choice":"other","confidence":0.35,"probabilities":{"backend":0.02,"data":0.02,"infra":0.02,"other":0.92,"security":0.02},"type":"choice"}},"model":"jev-mock"},"jev_decision":"review","jev_ok":true,"level":"INFO","msg":"cache hit rate 0.01 window=5m","node_id":"fixture-node","received_at":"2026-10-05T19:44:28.068567-07:00","recurrence":{"first_seen_ago_s":0,"occurrence":2,"previous_decisions":["archive"],"window_s":600},"routed_by":"jev","service":"cache","ts":"2026-10-05T09:00:16Z"},{"baseline":"archive","bypass":false,"fingerprint":"cache::cache hit rate #.# window#m","held_attempts":0,"id":"evt-000016","jev":{"answers":{"actionable":{"noul":0.6,"type":"noul"},"recurrence_concern":{"noul":0.5,"type":"noul"},"severity":{"choice":"info","confidence":0.92,"probabilities":{"critical":0.027,"info":0.92,"other":0.027,"warning":0.027},"type":"choice"},"team":{"choice":"other","confidence":0.35,"probabilities":{"backend":0.02,"data":0.02,"infra":0.02,"other":0.92,"security":0.02},"type":"choice"}},"model":"jev-mock"},"jev_decision":"review","jev_ok":true,"level":"INFO","msg":"cache hit rate 0.01 window=5m","node_id":"fixture-node","received_at":"2026-10-05T19:44:28.068567-07:00","recurrence":{"first_seen_ago_s":0,"occurrence":2,"previous_decisions":["archive"],"window_s":600},"routed_by":"jev","service":"cache","ts":"2026-10-05T09:00:16Z"},{"baseline":"archive","bypass":false,"fingerprint":"cache::cache hit rate #.# window#m","held_attempts":0,"id":"evt-000016","jev":{"answers":{"actionable":{"noul":0.6,"type":"noul"},"recurrence_concern":{"noul":0.5,"type":"noul"},"severity":{"choice":"info","confidence":0.92,"probabilities":{"critical":0.027,"info":0.92,"other":0.027,"warning":0.027},"type":"choice"},"team":{"choice":"other","confidence":0.35,"probabilities":{"backend":0.02,"data":0.02,"infra":0.02,"other":0.92,"security":0.02},"type":"choice"}},"model":"jev-mock"},"jev_decision":"review","jev_ok":true,"level":"INFO","msg":"cache hit rate 0.01 window=5m","node_id":"fixture-node","received_at":"2026-10-05T19:44:28.068567-07:00","recurrence":{"first_seen_ago_s":0,"occurrence":2,"previous_decisions":["archive"],"window_s":600},"routed_by":"jev","service":"cache","ts":"2026-10-05T09:00:16Z"}],"jev":[{"request":{"log":{"level":"INFO","msg":"cache hit rate 0.01 window=5m","service":"cache"},"recurrence":{"occurrence":2,"previous_routing_decisions":["archive"],"window":"10 minutes"}},"questions":{"actionable":{"instructions":"How actionable is this log for an on-call engineer RIGHT NOW, 0.0 to 1.0? Weigh recurrence heavily: a first, isolated occurrence of a benign-looking line is low. The SAME line repeating (occurrence 3 or more within 10 minutes) is much more concerning -- repeated auth failures suggest brute force, repeated restarts suggest a crash loop, repeated warnings suggest a degrading system. Escalate the score as occurrence count rises.","type":"noul"},"recurrence_concern":{"instructions":"How much does the RECURRENCE PATTERN alone elevate concern, 0.0 to 1.0? 0.0 = isolated occurrence, nothing to infer. 1.0 = clearly escalating pattern (e.g., repeated auth failures from one source, repeated crashes, warnings trending toward critical).","type":"noul"},"severity":{"choices":["info","warning","critical","other"],"criteria":{"critical":"Service-impacting right now, page someone","info":"Routine operational message, no action needed","other":"Does not fit the above","warning":"Needs attention soon but is not urgent"},"instructions":"Classify the severity of this log line.","type":"choice"},"team":{"choices":["backend","infra","data","security","other"],"criteria":{"backend":"Application code, APIs, services","data":"Databases, pipelines, warehouses","infra":"Hosts, network, Kubernetes, TLS","other":"Cannot tell from this event","security":"Authentication, intrusion, access control"},"instructions":"Which team owns this? backend = app/services, infra = hosts/network/kubernetes, data = pipelines/databases, security = auth/intrusion/certs.","type":"choice"}},"response":{"model":"jev-mock","answers":{"actionable":{"type":"noul","noul":0.6},"recurrence_concern":{"type":"noul","noul":0.5},"severity":{"type":"choice","choice":"info","probabilities":{"critical":0.027,"info":0.92,"other":0.027,"warning":0.027},"confidence":0.92},"team":{"type":"choice","choice":"other","probabilities":{"backend":0.02,"data":0.02,"infra":0.02,"other":0.92,"security":0.02},"confidence":0.35}}}}],"destination":"review","dest_label":"Review"}]},{"id":"outage","scenario":"Jev unreachable","note":"Jev answers 503. The two routine lines still reach the archive with no model call. The WARN record is held: one receipt is written, then it is posted back to the input every 2 to 4 seconds and handed to review after 15 attempts, about 45 seconds. Nothing is guessed and nothing is dropped.","stages":[{"title":"The input","text":"The record as the pipeline's HTTP input received it: a POST to /logs with this JSON body. Nothing has touched it yet.","source":"input:\n  http_server:\n    address: \"0.0.0.0:${INGEST_PORT:8080}\"\n    path: /logs\n    allowed_verbs: [\"POST\"]\n    # The response is held until the event is written out, and a Jev\n    # judgment takes ~3.5s. At the 5s default a burst queues past the limit\n    # and the input answers 408 for events it then processes anyway -- the\n    # source counts them lost while they land in a bucket.\n    timeout: 30s"},{"title":"Wait if held","text":"A record coming back from a hold waits 2 to 4 seconds, jittered so a recovery is not a stampede. First arrivals pass through untouched.","source":"- label: hold_wait\n  switch:\n    - check: 'this.held_attempts.number().catch(0) > 0'\n      processors:\n        - sleep:\n            duration: '${! (2000 + random_int(max: 2000)).string() + \"ms\" }'"},{"title":"Shape and fingerprint","text":"Adds received_at, node_id, the fingerprint, held_attempts (coerced to a whole number at least 0) and the severity-only baseline.","source":"- label: shape_fingerprint\n  mapping: |\n    root = this\n    root.received_at = this.received_at.or(now())   # a held record keeps its first arrival time\n    # Producer-supplied on first arrival, so never trusted as-is: coerce to a\n    # non-negative whole number. (A producer claiming 15 only skips its own hold.)\n    let ha = this.held_attempts.number().catch(0).floor()\n    root.held_attempts = if $ha < 0 { 0 } else { $ha }\n    root.node_id = env(\"NODE_ID\").or(\"edge-1\")\n    let norm = this.msg.lowercase().re_replace(\"[0-9]+\", \"#\").re_replace(\"[^a-z0-9 :/_.*#-]\", \"\").re_replace(\"\\\\s+\", \" \").trim()\n    root.fingerprint = this.service + \"::\" + $norm\n    # The named naive baseline, computed on the IDENTICAL input so the two\n    # can be compared record by record: route on severity alone.\n    root.baseline = if this.level == \"ERROR\" { \"page\" } else if this.level == \"WARN\" { \"notify\" } else { \"archive\" }"},{"title":"Count occurrences","text":"First arrival only: asks the counter how many times this fingerprint has been seen in 10 minutes and what was decided before. A held record is the same event, so it is not counted again.","source":"- label: track_recurrence\n  switch:\n    - check: 'this.held_attempts == 0'\n      processors:\n      - branch:\n          request_map: |\n            root = {\"fingerprint\": this.fingerprint}\n          processors:\n            - http:\n                url: http://127.0.0.1:8898/track\n                verb: POST\n                headers:\n                  Content-Type: application/json\n          result_map: |\n            root.recurrence = this"},{"title":"Skip the model for routine lines","text":"An exact allowlist of level INFO, service and raw message. A match sets bypass and goes to the archive with no model call. Any changed number, any WARN or ERROR and any novel INFO line is judged.","source":"- label: bypass_check\n  mapping: |\n    root = this\n    let routine = [\n      \"api|GET /health 200 2ms\",\n      \"api|GET /metrics 200 5ms\",\n      \"worker|cron heartbeat ok job=nightly-rollup\",\n      \"cache|cache hit rate 0.94 window=5m\",\n      \"api|gc pause 12ms heap=1.2gb\",\n      \"db|connection pool idle 45/50\",\n      \"deploy|rollout step 3/8 complete service=checkout\",\n    ]\n    root.bypass = this.level == \"INFO\" && $routine.contains(this.service + \"|\" + this.msg)"},{"title":"Ask Jev","text":"For records that were not bypassed: one request with the record, its recurrence history and four questions (actionable, severity, team, recurrence concern). Bypassed records skip this stage. If Jev does not answer, the catch block marks the answer unavailable.","source":"- label: ask_jev\n  switch:\n    - check: '!this.bypass'\n      processors:\n      - branch:\n          request_map: |\n            root.state = {\n              \"log\": {\n                \"level\": this.level,\n                \"service\": this.service,\n                \"msg\": this.msg,\n              },\n              \"recurrence\": {\n                \"occurrence\": this.recurrence.occurrence,\n                \"window\": \"10 minutes\",\n                \"first_seen_seconds_ago\": this.recurrence.first_seen_ago_s,\n                \"previous_routing_decisions\": this.recurrence.previous_decisions,\n              },\n            }\n            root.model = \"jev-latest\"\n            root.questions = {\n              \"actionable\": {\n                \"type\": \"noul\",\n                \"instructions\": \"How actionable is this log for an on-call engineer RIGHT NOW, 0.0 to 1.0? Weigh recurrence heavily: a first, isolated occurrence of a benign-looking line is low. The SAME line repeating (occurrence 3 or more within 10 minutes) is much more concerning -- repeated auth failures suggest brute force, repeated restarts suggest a crash loop, repeated warnings suggest a degrading system. Escalate the score as occurrence count rises.\",\n              },\n              \"severity\": {\n                \"type\": \"choice\",\n                \"instructions\": \"Classify the severity of this log line.\",\n                \"choices\": [\"info\", \"warning\", \"critical\", \"other\"],\n                \"criteria\": {\n                  \"info\": \"Routine operational message, no action needed\",\n                  \"warning\": \"Needs attention soon but is not urgent\",\n                  \"critical\": \"Service-impacting right now, page someone\",\n                  \"other\": \"Does not fit the above\"\n                }\n              },\n              \"team\": {\n                \"type\": \"choice\",\n                \"instructions\": \"Which team owns this? backend = app/services, infra = hosts/network/kubernetes, data = pipelines/databases, security = auth/intrusion/certs.\",\n                \"choices\": [\"backend\", \"infra\", \"data\", \"security\", \"other\"],\n                \"criteria\": {\n                  \"backend\": \"Application code, APIs, services\",\n                  \"infra\": \"Hosts, network, Kubernetes, TLS\",\n                  \"data\": \"Databases, pipelines, warehouses\",\n                  \"security\": \"Authentication, intrusion, access control\",\n                  \"other\": \"Cannot tell from this event\"\n                }\n              },\n              \"recurrence_concern\": {\n                \"type\": \"noul\",\n                \"instructions\": \"How much does the RECURRENCE PATTERN alone elevate concern, 0.0 to 1.0? 0.0 = isolated occurrence, nothing to infer. 1.0 = clearly escalating pattern (e.g., repeated auth failures from one source, repeated crashes, warnings trending toward critical).\",\n              },\n            }\n          processors:\n            - http:\n                url: ${JEV_API_URL}\n                verb: POST\n                headers:\n                  Content-Type: application/json\n            - catch:\n                # Jev unreachable: degrade gracefully, everything goes to review\n                - mapping: |\n                    root = {\"model\": \"jev-unavailable\", \"answers\": {}}\n          result_map: |\n            root.jev = {\"answers\": this.answers, \"model\": this.model.or(\"jev-latest\")}\n            root.jev_ok = this.model != \"jev-unavailable\""},{"title":"Decide","text":"Bypass archives. No answer and fewer than 15 attempts holds. No answer after 15 attempts goes to review. Critical at confidence 0.85 or more pages. Actionable 0.7 or more at confidence 0.5 or more notifies. Confidence under 0.6, or actionable from 0.4 to under 0.7, goes to review. Everything else archives.","source":"- label: cascade\n  mapping: |\n    root = this\n    root.routed_by = if this.bypass { \"expanso-bypass\" } else { \"jev\" }\n    let actionable = this.jev.answers.actionable.noul.or(0)\n    let sev = this.jev.answers.severity.choice.or(\"other\")\n    let conf = this.jev.answers.severity.confidence.or(0)\n    root.jev_decision = if this.bypass {\n      \"archive\"\n    } else if !this.jev_ok && this.held_attempts < 15 {\n      # Jev did not answer. Do not guess and do not give up yet: hold the\n      # record and ask again. See the \"held\" output below.\n      \"held\"\n    } else if !this.jev_ok {\n      \"review\"   # 15 attempts, ~45 s: stop holding, hand it to a human\n    } else if $sev == \"critical\" && $conf >= 0.85 {\n      \"page\"\n    } else if $actionable >= 0.7 && $conf >= 0.5 {\n      \"notify\"\n    } else if $conf < 0.6 || ($actionable >= 0.4 && $actionable < 0.7) {\n      \"review\"\n    } else {\n      \"archive\"\n    }"},{"title":"Prepare the log line","text":"Builds the operational log summary in message metadata from closed sets and hashes. The record itself does not change.","source":"- label: build_log_fields\n  mapping: |\n    # Only values from closed sets, generated ids, numbers and hashes leave the\n    # node. service / level / id come from the log producer and team /\n    # severity come back from a model: all are arbitrary strings, so each is\n    # checked against a closed allowlist and anything else is replaced, never\n    # passed through. Ids and fingerprints are hashed unconditionally.\n    let occ = this.recurrence.occurrence.number().catch(0)\n    let fp = this.fingerprint.string().hash(\"sha256\").encode(\"hex\").slice(0, 12)\n    let lvl = if [\"DEBUG\", \"INFO\", \"WARN\", \"ERROR\"].contains(this.level) { this.level } else { \"other\" }\n    let svc = if [\"api\", \"worker\", \"cache\", \"deploy\", \"db\", \"edge\", \"infra\", \"net\", \"auth\"].contains(this.service) { this.service } else { \"other\" }\n    # The id is producer-supplied, so it is ALWAYS hashed: a pattern such as\n    # ^evt-... would still admit \"evt-alice-smith\". sha256 so the same 12 hex\n    # chars can be recomputed from a local receipt to correlate the two:\n    #   hashlib.sha256(record[\"id\"].encode()).hexdigest()[:12]\n    let eid = this.id.string().hash(\"sha256\").encode(\"hex\").slice(0, 12)\n    let tail = \" event=\" + $eid + \" fp=\" + $fp + \" occ=\" + $occ.string() + \" svc=\" + $svc + \" lvl=\" + $lvl\n    let a = this.jev.answers.or({})\n    let sev = if [\"info\", \"warning\", \"critical\", \"other\"].contains($a.severity.choice) { $a.severity.choice } else { \"invalid\" }\n    let team = if [\"backend\", \"infra\", \"data\", \"security\", \"other\"].contains($a.team.choice) { $a.team.choice } else { \"invalid\" }\n    let act = ($a.actionable.noul.number().catch(0) * 100).round() / 100\n    let conf = ($a.severity.confidence.number().catch(0) * 100).round() / 100\n    meta log_kind = if this.bypass {\n      if $occ == 1 || $occ % 250 == 0 { \"bypass\" } else { \"\" }\n    } else if this.jev_decision == \"held\" {\n      # one line when a record is FIRST held; its retries are not news\n      if this.held_attempts == 0 { \"held\" } else { \"\" }\n    } else if !this.jev_ok.or(false) {\n      \"fallback\"\n    } else {\n      \"judged\"\n    }\n    meta log_summary = if this.bypass {\n      \"triage bypass -> ARCHIVE selected, output pending: known-routine line, no model call (checkpoint: a fingerprint's first occurrence, then every 250th)\" + $tail\n    } else if this.jev_decision == \"held\" {\n      \"triage held -> HOLD selected, output pending: Jev gave no answer, nothing guessed; retrying every 2-4s, up to 15 attempts (severity-only baseline: \" + this.baseline + \")\" + $tail\n    } else if !this.jev_ok.or(false) {\n      \"triage fallback -> REVIEW selected, output pending: Jev gave no answer after \" + this.held_attempts.string() + \" attempts, nothing guessed (severity-only baseline: \" + this.baseline + \")\" + $tail\n    } else {\n      \"triage judged -> \" + this.jev_decision.uppercase() + \" selected, output pending: \" + (if this.held_attempts > 0 { \"released after \" + this.held_attempts.string() + \" held attempts; \" } else { \"\" }) + \"Jev reported actionable=\" + $act.string() + \" severity=\" + $sev + \" confidence=\" + $conf.string() + \" team=\" + $team + \" (severity-only baseline: \" + this.baseline + \")\" + $tail\n    }\n    meta log_event = $eid"},{"title":"Write the log line","text":"Logs every judged or held selection, and a bypass checkpoint on a fingerprint's first occurrence and every 250th. The record itself does not change.","source":"- label: log_selection\n  switch:\n    - check: 'meta(\"log_kind\") == \"fallback\" || meta(\"log_kind\") == \"held\"'\n      processors:\n        - log:\n            level: WARN\n            message: '${! meta(\"log_summary\") }'\n            fields_mapping: |\n              root.stage = \"select\"\n              root.outcome = meta(\"log_kind\") + \"_selected\"\n              root.held_attempts = this.held_attempts\n              root.destination = this.jev_decision\n              root.baseline = this.baseline\n              root.event_id = meta(\"log_event\")\n              root.write_confirmed = false\n    - check: 'meta(\"log_kind\") == \"judged\" || meta(\"log_kind\") == \"bypass\"'\n      processors:\n        - log:\n            level: INFO\n            message: '${! meta(\"log_summary\") }'\n            fields_mapping: |\n              root.stage = \"select\"\n              root.outcome = meta(\"log_kind\") + \"_\" + this.jev_decision + \"_selected\"\n              root.destination = this.jev_decision\n              root.baseline = this.baseline\n              root.event_id = meta(\"log_event\")\n              root.model_called = !this.bypass\n              root.write_confirmed = false"},{"title":"Record the decision","text":"Sends the decision to the counter (POST /record) so the next occurrence sees it in its history. Not done while a record is held.","source":"- label: record_decision\n  switch:\n    - check: 'this.jev_decision != \"held\"'\n      processors:\n      - branch:\n          request_map: |\n            root = {\"fingerprint\": this.fingerprint, \"decision\": this.jev_decision}\n          processors:\n            - http:\n                url: http://127.0.0.1:8898/record\n                verb: POST\n                headers:\n                  Content-Type: application/json"},{"title":"Route to a bucket","text":"A switch writes the record to page, notify, review or archive. A held record writes a receipt to held first, then is posted back to this pipeline's own input to ask again.","source":"output:\n  switch:\n    cases:\n      # HOLD. Jev did not answer, so the record is neither guessed nor dropped.\n      # First hold only: write one receipt, then fall through (`continue`) to...\n      - check: this.jev_decision == \"held\" && this.held_attempts == 0\n        continue: true\n        output:\n          file:\n            path: data/held.jsonl\n            codec: lines\n      # ...the loop: re-submit to this pipeline's own input with the attempt\n      # count raised. It waits at step 0, asks Jev again, and takes its real\n      # route on the pass where Jev answers. After 15 attempts the gate stops\n      # holding and sends it to review.\n      - check: this.jev_decision == \"held\"\n        output:\n          http_client:\n            url: http://127.0.0.1:${INGEST_PORT:8080}/logs\n            verb: POST\n            headers:\n              Content-Type: application/json\n            max_in_flight: 64\n          processors:\n            - mapping: |\n                root = this\n                root.held_attempts = this.held_attempts + 1\n      - check: this.jev_decision == \"page\"\n        output:\n          file:\n            path: data/page.jsonl\n            codec: lines\n      - check: this.jev_decision == \"notify\"\n        output:\n          file:\n            path: data/notify.jsonl\n            codec: lines\n      - check: this.jev_decision == \"review\"\n        output:\n          file:\n            path: data/review.jsonl\n            codec: lines\n      - check: \"true\"\n        output:\n          file:\n            path: data/archive.jsonl\n            codec: lines"}],"queues":{"page":"Page","notify":"Notify","review":"Review","archive":"Archive","held":"Held receipt"},"questions":[{"id":"actionable","type":"noul","instructions":"How actionable is this log for an on-call engineer RIGHT NOW, 0.0 to 1.0? Weigh recurrence heavily: a first, isolated occurrence of a benign-looking line is low. The SAME line repeating (occurrence 3 or more within 10 minutes) is much more concerning -- repeated auth failures suggest brute force, repeated restarts suggest a crash loop, repeated warnings suggest a degrading system. Escalate the score as occurrence count rises."},{"id":"recurrence_concern","type":"noul","instructions":"How much does the RECURRENCE PATTERN alone elevate concern, 0.0 to 1.0? 0.0 = isolated occurrence, nothing to infer. 1.0 = clearly escalating pattern (e.g., repeated auth failures from one source, repeated crashes, warnings trending toward critical)."},{"id":"severity","type":"choice","instructions":"Classify the sev
