s; use your own Jev endpoint and key to see Jev's judgments."}],"deploy":[{"title":"Deploy it through Expanso Cloud","intro":"Pipelines here are deployed through Expanso Cloud and run by the Edge agent on your node. Credentials come from the environment, never from flags.","commands":["export EXPANSO_CLI_ENDPOINT=<your network endpoint>\nexport EXPANSO_CLI_AUTH_API_KEY=<your API key>","expanso-cli job deploy demos/01-log-triage/pipeline-logging.yaml"],"after":"Set TYPESAFE_API_KEY in the environment of the Edge agent that runs the job. It never goes in the job file or in Expanso Cloud. Add a selector with match_labels to pin the job to specific nodes."},{"title":"Where it listens and where it writes","intro":"The input listens on 127.0.0.1:8080 unless INGEST_ADDRESS says otherwise. Put TLS and authentication in front of it before it accepts traffic from another host. Each queue is a JSONL file under the agent's working directory; to deliver somewhere else, replace that queue's file output with the output your system needs. The decision logic upstream does not change.","commands":[]}],"files":[{"name":"demos/01-log-triage/pipeline-logging.yaml","text":"# Act 2 of the demo: Expanso alone. Deterministic, no model in the loop.\n#\n# Every event is shaped, fingerprinted and given its recurrence context, then\n# written to ONE place -- the log archive. Nothing is dropped. This is what a pipeline can do with\n# rules and counting: it makes the data uniform and searchable, and it knows\n# \"this is the 4th time in 10 minutes\", but it cannot say whether that matters.\n# pipeline-recurrence.yaml is the same front half with Jev asked that question.\n#\n# Both files deploy as the SAME job, `log-triage`. Deploying the Jev version\n# over this one is an in-place version bump in Expanso Cloud -- one pipeline\n# that got smarter, not two pipelines fighting over the same HTTP input.\n\nname: log-triage\ntype: pipeline\ndescription: Shape, fingerprint and count every log line; archive all of it. No model in the loop.\nnamespace: demo\n\nlabels:\n  category: log-processing\n  pattern: shape-and-archive\n\nconfig:\n  input:\n    http_server:\n      address: \"0.0.0.0:${INGEST_PORT:8080}\"\n      path: /logs\n      allowed_verbs: [\"POST\"]\n      # The response is held until the event is written out, and a Jev\n      # judgment takes ~3.5s. At the 5s default a burst queues past the limit\n      # and the input answers 408 for events it then processes anyway -- the\n      # source counts them lost while they land in a bucket.\n      timeout: 30s\n\n  pipeline:\n    processors:\n      # 1. shape + deterministic fingerprint (identical to the Jev pipeline, so\n      #    a record looks the same in the archive whichever pipeline wrote it)\n      - label: shape_fingerprint\n        mapping: |\n          root = this\n          root.received_at = now()\n          root.node_id = env(\"NODE_ID\").or(\"edge-1\")\n          let norm = this.msg.lowercase().re_replace(\"[0-9]+\", \"#\").re_replace(\"[^a-z0-9 :/_.*#-]\", \"\").re_replace(\"\\\\s+\", \" \").trim()\n          root.fingerprint = this.service + \"::\" + $norm\n          # The named naive baseline, computed on the IDENTICAL input so the two\n          # can be compared record by record: route on severity alone.\n          root.baseline = if this.level == \"ERROR\" { \"page\" } else if this.level == \"WARN\" { \"notify\" } else { \"archive\" }\n\n      # 2. deterministic temporal context: occurrence count in the window\n      - label: track_recurrence\n        branch:\n          request_map: |\n            root = {\"fingerprint\": this.fingerprint}\n          processors:\n            - http:\n                url: http://127.0.0.1:8898/track\n                verb: POST\n                headers:\n                  Content-Type: application/json\n          result_map: |\n            root.recurrence = this\n\n      - label: mark_routed\n        mapping: |\n          root = this\n          root.routed_by = \"expanso\"\n\n      # operational log for the Expanso Cloud Logs tab: a checkpoint, not a\n      # per-record log. Same rules as pipeline-recurrence.yaml: a destination is\n      # \"selected\" and the write is pending (this runs before the output does);\n      # only allowlisted values, generated ids, numbers and hashes leave the\n      # node; sampling is per fingerprint, not a global rate.\n      - label: build_log_fields\n        mapping: |\n          # Only values from closed sets, generated ids, numbers and hashes leave the\n          # node. service / level / id come from the log producer and team /\n          # severity come back from a model: all are arbitrary strings, so each is\n          # checked against a closed allowlist and anything else is replaced, never\n          # passed through. Ids and fingerprints are hashed unconditionally.\n          let occ = this.recurrence.occurrence.number().catch(0)\n          let fp = this.fingerprint.string().hash(\"sha256\").encode(\"hex\").slice(0, 12)\n          let lvl = if [\"DEBUG\", \"INFO\", \"WARN\", \"ERROR\"].contains(this.level) { this.level } else { \"other\" }\n          let svc = if [\"api\", \"worker\", \"cache\", \"deploy\", \"db\", \"edge\", \"infra\", \"net\", \"auth\"].contains(this.service) { this.service } else { \"other\" }\n          # The id is producer-supplied, so it is ALWAYS hashed: a pattern such as\n          # ^evt-... would still admit \"evt-alice-smith\". sha256 so the same 12 hex\n          # chars can be recomputed from a local receipt to correlate the two:\n          #   hashlib.sha256(record[\"id\"].encode()).hexdigest()[:12]\n          let eid = this.id.string().hash(\"sha256\").encode(\"hex\").slice(0, 12)\n          let tail = \" event=\" + $eid + \" fp=\" + $fp + \" occ=\" + $occ.string() + \" svc=\" + $svc + \" lvl=\" + $lvl\n          meta log_kind = if $occ == 1 || $occ % 250 == 0 { \"archive\" } else { \"\" }\n          meta log_summary = \"triage archive -> ARCHIVE selected, output pending: structured and counted, no model in this pipeline (checkpoint: a fingerprint's first occurrence, then every 250th)\" + $tail\n          meta log_event = $eid\n      - label: log_selection\n        switch:\n          - check: 'meta(\"log_kind\") == \"archive\"'\n            processors:\n              - log:\n                  level: INFO\n                  message: '${! meta(\"log_summary\") }'\n                  fields_mapping: |\n                    root.stage = \"select\"\n                    root.outcome = \"archive_selected\"\n                    root.destination = \"archive\"\n                    root.event_id = meta(\"log_event\")\n                    root.model_called = false\n                    root.write_confirmed = false\n\n  output:\n    file:\n      path: data/logs.jsonl\n      codec: lines\n","type":"application/x-yaml"},{"name":"demos/01-log-triage/input.jsonl","text":"{\"id\": \"evt-000001\", \"ts\": \"2026-10-05T09:00:01Z\", \"level\": \"INFO\", \"service\": \"api\", \"msg\": \"GET /health 200 2ms\"}\n{\"id\": \"evt-000002\", \"ts\": \"2026-10-05T09:00:02Z\", \"level\": \"INFO\", \"service\": \"api\", \"msg\": \"GET /metrics 200 5ms\"}\n{\"id\": \"evt-000003\", \"ts\": \"2026-10-05T09:00:03Z\", \"level\": \"INFO\", \"service\": \"worker\", \"msg\": \"cron heartbeat ok job=nightly-rollup\"}\n{\"id\": \"evt-000004\", \"ts\": \"2026-10-05T09:00:04Z\", \"level\": \"INFO\", \"service\": \"api\", \"msg\": \"GET /health 500 9000ms\"}\n{\"id\": \"evt-000005\", \"ts\": \"2026-10-05T09:00:05Z\", \"level\": \"INFO\", \"service\": \"api\", \"msg\": \"config reload requested by unknown actor\"}\n{\"id\": \"evt-000006\", \"ts\": \"2026-10-05T09:00:06Z\", \"level\": \"WARN\", \"service\": \"auth\", \"msg\": \"auth failed for user admin from 10.0.9.12\"}\n{\"id\": \"evt-000007\", \"ts\": \"2026-10-05T09:00:07Z\", \"level\": \"WARN\", \"service\": \"auth\", \"msg\": \"auth failed for user admin from 10.0.9.12\"}\n{\"id\": \"evt-000008\", \"ts\": \"2026-10-05T09:00:08Z\", \"level\": \"WARN\", \"service\": \"auth\", \"msg\": \"auth failed for user admin from 10.0.9.12\"}\n{\"id\": \"evt-000009\", \"ts\": \"2026-10-05T09:00:09Z\", \"level\": \"WARN\", \"service\": \"auth\", \"msg\": \"auth failed for user admin from 10.0.9.12\"}\n{\"id\": \"evt-000010\", \"ts\": \"2026-10-05T09:00:10Z\", \"level\": \"WARN\", \"service\": \"db\", \"msg\": \"slow query 4.2s on orders table rows=120k\"}\n{\"id\": \"evt-000011\", \"ts\": \"2026-10-05T09:00:11Z\", \"level\": \"ERROR\", \"service\": \"api\", \"msg\": \"OOMKilled container api-7 exit=137\"}\n{\"id\": \"evt-000012\", \"ts\": \"2026-10-05T09:00:12Z\", \"level\": \"ERROR\", \"service\": \"db\", \"msg\": \"database primary unreachable, failover initiated\"}\n{\"id\": \"evt-000013\", \"ts\": \"2026-10-05T09:00:13Z\", \"level\": \"INFO\", \"service\": \"cache\", \"msg\": \"cache hit rate 0.94 window=5m\"}\n{\"id\": \"evt-000014\", \"ts\": \"2026-10-05T09:00:14Z\", \"level\": \"WARN\", \"service\": \"edge\", \"msg\": \"TLS certificate expiring in 72 hours, renewal failed twice\"}\n{\"id\": \"evt-000015\", \"ts\": \"2026-10-05T09:00:15Z\", \"level\": \"INFO\", \"service\": \"deploy\", \"msg\": \"rollout step 3/8 complete service=checkout\"}\n{\"id\": \"evt-000016\", \"ts\": \"2026-10-05T09:00:16Z\", \"level\": \"INFO\", \"service\": \"cache\", \"msg\": \"cache hit rate 0.01 window=5m\"}\n","type":"application/x-ndjson"},{"name":"demos/01-log-triage/fixtures/logging.expected/logs.jsonl","text":"{\"baseline\": \"archive\", \"fingerprint\": \"api::get /health # #ms\", \"id\": \"evt-000001\", \"level\": \"INFO\", \"msg\": \"GET /health 200 2ms\", \"node_id\": \"fixture-node\", \"recurrence\": {\"occurrence\": 1, \"previous_decisions\": [], \"window_s\": 600}, \"routed_by\": \"expanso\", \"service\": \"api\", \"ts\": \"2026-10-05T09:00:01Z\"}\n{\"baseline\": \"archive\", \"fingerprint\": \"api::get /metrics # #ms\", \"id\": \"evt-000002\", \"level\": \"INFO\", \"msg\": \"GET /metrics 200 5ms\", \"node_id\": \"fixture-node\", \"recurrence\": {\"occurrence\": 1, \"previous_decisions\": [], \"window_s\": 600}, \"routed_by\": \"expanso\", \"service\": \"api\", \"ts\": \"2026-10-05T09:00:02Z\"}\n{\"baseline\": \"archive\", \"fingerprint\": \"worker::cron heartbeat ok jobnightly-rollup\", \"id\": \"evt-000003\", \"level\": \"INFO\", \"msg\": \"cron heartbeat ok job=nightly-rollup\", \"node_id\": \"fixture-node\", \"recurrence\": {\"occurrence\": 1, \"previous_decisions\": [], \"window_s\": 600}, \"routed_by\": \"expanso\", \"service\": \"worker\", \"ts\": \"2026-10-05T09:00:03Z\"}\n{\"baseline\": \"archive\", \"fingerprint\": \"api::get /health # #ms\", \"id\": \"evt-000004\", \"level\": \"INFO\", \"msg\": \"GET /health 500 9000ms\", \"node_id\": \"fixture-node\", \"recurrence\": {\"occurrence\": 2, \"previous_decisions\": [], \"window_s\": 600}, \"routed_by\": \"expanso\", \"service\": \"api\", \"ts\": \"2026-10-05T09:00:04Z\"}\n{\"baseline\": \"archive\", \"fingerprint\": \"api::config reload requested by unknown actor\", \"id\": \"evt-000005\", \"level\": \"INFO\", \"msg\": \"config reload requested by unknown actor\", \"node_id\": \"fixture-node\", \"recurrence\": {\"occurrence\": 1, \"previous_decisions\": [], \"window_s\": 600}, \"routed_by\": \"expanso\", \"service\": \"api\", \"ts\": \"2026-10-05T09:00:05Z\"}\n{\"baseline\": \"notify\", \"fingerprint\": \"auth::auth failed for user admin from #.#.#.#\", \"id\": \"evt-000006\", \"level\": \"WARN\", \"msg\": \"auth failed for user admin from 10.0.9.12\", \"node_id\": \"fixture-node\", \"recurrence\": {\"occurrence\": 1, \"previous_decisions\": [], \"window_s\": 600}, \"routed_by\": \"expanso\", \"service\": \"auth\", \"ts\": \"2026-10-05T09:00:06Z\"}\n{\"baseline\": \"notify\", \"fingerprint\": \"auth::auth failed for user admin from #.#.#.#\", \"id\": \"evt-000007\", \"level\": \"WARN\", \"msg\": \"auth failed for user admin from 10.0.9.12\", \"node_id\": \"fixture-node\", \"recurrence\": {\"occurrence\": 2, \"previous_decisions\": [], \"window_s\": 600}, \"routed_by\": \"expanso\", \"service\": \"auth\", \"ts\": \"2026-10-05T09:00:07Z\"}\n{\"baseline\": \"notify\", \"fingerprint\": \"auth::auth failed for user admin from #.#.#.#\", \"id\": \"evt-000008\", \"level\": \"WARN\", \"msg\": \"auth failed for user admin from 10.0.9.12\", \"node_id\": \"fixture-node\", \"recurrence\": {\"occurrence\": 3, \"previous_decisions\": [], \"window_s\": 600}, \"routed_by\": \"expanso\", \"service\": \"auth\", \"ts\": \"2026-10-05T09:00:08Z\"}\n{\"baseline\": \"notify\", \"fingerprint\": \"auth::auth failed for user admin from #.#.#.#\", \"id\": \"evt-000009\", \"level\": \"WARN\", \"msg\": \"auth failed for user admin from 10.0.9.12\", \"node_id\": \"fixture-node\", \"recurrence\": {\"occurrence\": 4, \"previous_decisions\": [], \"window_s\": 600}, \"routed_by\": \"expanso\", \"service\": \"auth\", \"ts\": \"2026-10-05T09:00:09Z\"}\n{\"baseline\": \"notify\", \"fingerprint\": \"db::slow query #.#s on orders table rows#k\", \"id\": \"evt-000010\", \"level\": \"WARN\", \"msg\": \"slow query 4.2s on orders table rows=120k\", \"node_id\": \"fixture-node\", \"recurrence\": {\"occurrence\": 1, \"previous_decisions\": [], \"window_s\": 600}, \"routed_by\": \"expanso\", \"service\": \"db\", \"ts\": \"2026-10-05T09:00:10Z\"}\n{\"baseline\": \"page\", \"fingerprint\": \"api::oomkilled container api-# exit#\", \"id\": \"evt-000011\", \"level\": \"ERROR\", \"msg\": \"OOMKilled container api-7 exit=137\", \"node_id\": \"fixture-node\", \"recurrence\": {\"occurrence\": 1, \"previous_decisions\": [], \"window_s\": 600}, \"routed_by\": \"expanso\", \"service\": \"api\", \"ts\": \"2026-10-05T09:00:11Z\"}\n{\"baseline\": \"page\", \"fingerprint\": \"db::database primary unreachable failover initiated\", \"id\": \"evt-000012\", \"level\": \"ERROR\", \"msg\": \"database primary unreachable, failover initiated\", \"node_id\": \"fixture-node\", \"recurrence\": {\"occurrence\": 1, \"previous_decisions\": [], \"window_s\": 600}, \"routed_by\": \"expanso\", \"service\": \"db\", \"ts\": \"2026-10-05T09:00:12Z\"}\n{\"baseline\": \"archive\", \"fingerprint\": \"cache::cache hit rate #.# window#m\", \"id\": \"evt-000013\", \"level\": \"INFO\", \"msg\": \"cache hit rate 0.94 window=5m\", \"node_id\": \"fixture-node\", \"recurrence\": {\"occurrence\": 1, \"previous_decisions\": [], \"window_s\": 600}, \"routed_by\": \"expanso\", \"service\": \"cache\", \"ts\": \"2026-10-05T09:00:13Z\"}\n{\"baseline\": \"notify\", \"fingerprint\": \"edge::tls certificate expiring in # hours renewal failed twice\", \"id\": \"evt-000014\", \"level\": \"WARN\", \"msg\": \"TLS certificate expiring in 72 hours, renewal failed twice\", \"node_id\": \"fixture-node\", \"recurrence\": {\"occurrence\": 1, \"previous_decisions\": [], \"window_s\": 600}, \"routed_by\": \"expanso\", \"service\": \"edge\", \"ts\": \"2026-10-05T09:00:14Z\"}\n{\"baseline\": \"archive\", \"fingerprint\": \"deploy::rollout step #/# complete servicecheckout\", \"id\": \"evt-000015\", \"level\": \"INFO\", \"msg\": \"rollout step 3/8 complete service=checkout\", \"node_id\": \"fixture-node\", \"recurrence\": {\"occurrence\": 1, \"previous_decisions\": [], \"window_s\": 600}, \"routed_by\": \"expanso\", \"service\": \"deploy\", \"ts\": \"2026-10-05T09:00:15Z\"}\n{\"baseline\": \"archive\", \"fingerprint\": \"cache::cache hit rate #.# window#m\", \"id\": \"evt-000016\", \"level\": \"INFO\", \"msg\": \"cache hit rate 0.01 window=5m\", \"node_id\": \"fixture-node\", \"recurrence\": {\"occurrence\": 2, \"previous_decisions\": [], \"window_s\": 600}, \"routed_by\": \"expanso\", \"service\": \"cache\", \"ts\": \"2026-10-05T09:00:16Z\"}\n","type":"application/x-ndjson"},{"name":"demos/01-log-triage/pipeline-recurrence.yaml","text":"# Jev recurrence demo: deterministic temporal assembly (Expanso) + judgment (Jev).\n#\n# Thesis: Expanso does what computers are good at -- count, window, recall,\n# assemble -- and Jev does what they aren't: \"given this history, how\n# concerning is this?\" The same log line scores differently on occurrence\n# #1 vs #4, because the context changed.\n#\n# Flow per event:\n#   1. shape + fingerprint (deterministic normalization)\n#   2. POST /track -> occurrence N, first_seen_ago, previous decisions (deterministic)\n#   2b. deterministic bypass: exact-match known-benign INFO lines skip the model\n#   3. ask Jev WITH the recurrence history in state (judgment) -- the rest\n#   4. confidence cascade: page / notify / review / archive\n#      - review catches uncertainty AND near-threshold scores (the gradient,\n#        not just a binary line)\n#   4h. if Jev did not answer: HOLD -- re-submit, wait 2-4 s, ask again, up to 15 attempts\n#   5. POST /record the decision (deterministic, feeds future history)\n#   6. route to the endpoint file\n\nname: log-triage\ntype: pipeline\ndescription: Recurrence-aware log triage -- Expanso assembles temporal context, Jev judges it.\nnamespace: demo\n\nlabels:\n  category: log-processing\n  model: jev\n  pattern: temporal-context\n\nconfig:\n  input:\n    http_server:\n      address: \"0.0.0.0:${INGEST_PORT:8080}\"\n      path: /logs\n      allowed_verbs: [\"POST\"]\n      # The response is held until the event is written out, and a Jev\n      # judgment takes ~3.5s. At the 5s default a burst queues past the limit\n      # and the input answers 408 for events it then processes anyway -- the\n      # source counts them lost while they land in a bucket.\n      timeout: 30s\n\n  # The hold path below re-submits a record to this pipeline's own input. With a\n  # buffer the input acknowledges once the record is queued; without one it keeps\n  # the request open until the record is fully delivered, so every retry would\n  # nest inside the request that made it and time out.\n  buffer:\n    memory:\n      limit: 104857600\n\n  pipeline:\n    # Held records wait INSIDE a processor thread (step 0). Threads are cheap and\n    # a waiting one costs nothing, but there must be more of them than records\n    # on hold, or routine traffic queues behind the waiters.\n    threads: 256\n    processors:\n      # 0. a record that was held comes back round here. Wait before asking Jev\n      #    again: 2-4 s, jittered, so that when Jev returns the backlog arrives\n      #    spread out instead of as one thundering herd. (The wait lives here and\n      #    not on the output because output processors run one at a time: a 3 s\n      #    sleep there released one record every 3 s and stalled the pipeline.)\n      - label: hold_wait\n        switch:\n          - check: 'this.held_attempts.number().catch(0) > 0'\n            processors:\n              - sleep:\n                  duration: '${! (2000 + random_int(max: 2000)).string() + \"ms\" }'\n\n      # 1. shape + deterministic fingerprint\n      - label: shape_fingerprint\n        mapping: |\n          root = this\n          root.received_at = this.received_at.or(now())   # a held record keeps its first arrival time\n          # Producer-supplied on first arrival, so never trusted as-is: coerce to a\n          # non-negative whole number. (A producer claiming 15 only skips its own hold.)\n          let ha = this.held_attempts.number().catch(0).floor()\n          root.held_attempts = if $ha < 0 { 0 } else { $ha }\n          root.node_id = env(\"NODE_ID\").or(\"edge-1\")\n          let norm = this.msg.lowercase().re_replace(\"[0-9]+\", \"#\").re_replace(\"[^a-z0-9 :/_.*#-]\", \"\").re_replace(\"\\\\s+\", \" \").trim()\n          root.fingerprint = this.service + \"::\" + $norm\n          # The named naive baseline, computed on the IDENTICAL input so the two\n          # can be compared record by record: route on severity alone.\n          root.baseline = if this.level == \"ERROR\" { \"page\" } else if this.level == \"WARN\" { \"notify\" } else { \"archive\" }\n\n      # 2. deterministic temporal assembly: occurrence count + history. First\n      #    arrival only: a held record coming back round is the SAME event, and\n      #    counting it again would inflate its own recurrence.\n      - label: track_recurrence\n        switch:\n          - check: 'this.held_attempts == 0'\n            processors:\n            - branch:\n                request_map: |\n                  root = {\"fingerprint\": this.fingerprint}\n                processors:\n                  - http:\n                      url: http://127.0.0.1:8898/track\n                      verb: POST\n                      headers:\n                        Content-Type: application/json\n                result_map: |\n                  root.recurrence = this\n\n      # 2b. deterministic bypass: does this record need a model at all?\n      #     An explicit allowlist of known-benign lines. A match goes to the\n      #     archive with NO model call. It matches on level + service + the RAW\n      #     message, exactly -- NOT on the fingerprint. The fingerprint omits the\n      #     level and erases every number, so matching on it would wave through\n      #     \"GET /health 500 9000ms\", a WARN carrying a health-check message, or\n      #     \"cache hit rate 0.01\": it would normalise the danger away and then\n      #     call the result routine. Exact match means:\n      #       - only INFO can bypass (explicit guard, not an accident of the list)\n      #       - any changed value -- status, latency, rate, count -- is a\n      #         different string, so it is judged\n      #       - any novel message is judged, including INFO ones such as\n      #         \"config reload requested by unknown actor\"\n      #       - nothing is dropped or sampled away; every record is written\n      #         somewhere, and bypassed ones say so (routed_by)\n      #     The cost is that a real fleet's routine lines vary in their numbers\n      #     and would need bounded patterns (\"200, under 50ms\") rather than exact\n      #     strings. That is ordinary rule-writing and rules are the right tool\n      #     for it. Jev is for what is left.\n      - label: bypass_check\n        mapping: |\n          root = this\n          let routine = [\n            \"api|GET /health 200 2ms\",\n            \"api|GET /metrics 200 5ms\",\n            \"worker|cron heartbeat ok job=nightly-rollup\",\n            \"cache|cache hit rate 0.94 window=5m\",\n            \"api|gc pause 12ms heap=1.2gb\",\n            \"db|connection pool idle 45/50\",\n            \"deploy|rollout step 3/8 complete service=checkout\",\n          ]\n          root.bypass = this.level == \"INFO\" && $routine.contains(this.service + \"|\" + this.msg)\n\n      # 3. Jev judgment, WITH the recurrence history in state -- only for records\n      #    the bypass did not clear. This switch is the whole cost story: a\n      #    bypassed record never reaches the http processor below.\n      - label: ask_jev\n        switch:\n          - check: '!this.bypass'\n            processors:\n            - branch:\n                request_map: |\n                  root.state = {\n                    \"log\": {\n                      \"level\": this.level,\n                      \"service\": this.service,\n                      \"msg\": this.msg,\n                    },\n                    \"recurrence\": {\n                      \"occurrence\": this.recurrence.occurrence,\n                      \"window\": \"10 minutes\",\n                      \"first_seen_seconds_ago\": this.recurrence.first_seen_ago_s,\n                      \"previous_routing_decisions\": this.recurrence.previous_decisions,\n                    },\n                  }\n                  root.model = \"jev-latest\"\n                  root.questions = {\n                    \"actionable\": {\n                      \"type\": \"noul\",\n                      \"instructions\": \"How actionable is this log for an on-call engineer RIGHT NOW, 0.0 to 1.0? Weigh recurrence heavily: a first, isolated occurrence of a benign-looking line is low. The SAME line repeating (occurrence 3 or more within 10 minutes) is much more concerning -- repeated auth failures suggest brute force, repeated restarts suggest a crash loop, repeated warnings suggest a degrading system. Escalate the score as occurrence count rises.\",\n                    },\n                    \"severity\": {\n                      \"type\": \"choice\",\n                      \"instructions\": \"Classify the severity of this log line.\",\n                      \"choices\": [\"info\", \"warning\", \"critical\", \"other\"],\n                      \"criteria\": {\n                        \"info\": \"Routine operational message, no action needed\",\n                        \"warning\": \"Needs attention soon but is not urgent\",\n                        \"critical\": \"Service-impacting right now, page someone\",\n                        \"other\": \"Does not fit the above\"\n                      }\n                    },\n                    \"team\": {\n                      \"type\": \"choice\",\n                      \"instructions\": \"Which team owns this? backend = app/services, infra = hosts/network/kubernetes, data = pipelines/databases, security = auth/intrusion/certs.\",\n                      \"choices\": [\"backend\", \"infra\", \"data\", \"security\", \"other\"],\n                      \"criteria\": {\n                        \"backend\": \"Application code, APIs, services\",\n                        \"infra\": \"Hosts, network, Kubernetes, TLS\",\n                        \"data\": \"Databases, pipelines, warehouses\",\n                        \"security\": \"Authentication, intrusion, access control\",\n                        \"other\": \"Cannot tell from this event\"\n                      }\n                    },\n                    \"recurrence_concern\": {\n                      \"type\": \"noul\",\n                      \"instructions\": \"How much does the RECURRENCE PATTERN alone elevate concern, 0.0 to 1.0? 0.0 = isolated occurrence, nothing to infer. 1.0 = clearly escalating pattern (e.g., repeated auth failures from one source, repeated crashes, warnings trending toward critical).\",\n                    },\n                  }\n                processors:\n                  - http:\n                      url: ${JEV_API_URL}\n                      verb: POST\n                      headers:\n                        Content-Type: application/json\n                  - catch:\n                      # Jev unreachable: degrade gracefully, everything goes to review\n                      - mapping: |\n                          root = {\"model\": \"jev-unavailable\", \"answers\": {}}\n                result_map: |\n                  root.jev = {\"answers\": this.answers, \"model\": this.model.or(\"jev-latest\")}\n                  root.jev_ok = this.model != \"jev-unavailable\"\n\n      # 4. confidence cascade: deterministic gates over Jev's graded judgment.\n      #    review catches BOTH uncertainty (low confidence) and near-threshold\n      #    scores -- the gradient, not a binary line.\n      - label: cascade\n        mapping: |\n          root = this\n          root.routed_by = if this.bypass { \"expanso-bypass\" } else { \"jev\" }\n          let actionable = this.jev.answers.actionable.noul.or(0)\n          let sev = this.jev.answers.severity.choice.or(\"other\")\n          let conf = this.jev.answers.severity.confidence.or(0)\n          root.jev_decision = if this.bypass {\n            \"archive\"\n          } else if !this.jev_ok && this.held_attempts < 15 {\n            # Jev did not answer. Do not guess and do not give up yet: hold the\n            # record and ask again. See the \"held\" output below.\n            \"held\"\n          } else if !this.jev_ok {\n            \"review\"   # 15 attempts, ~45 s: stop holding, hand it to a human\n          } else if $sev == \"critical\" && $conf >= 0.85 {\n            \"page\"\n          } else if $actionable >= 0.7 && $conf >= 0.5 {\n            \"notify\"\n          } else if $conf < 0.6 || ($actionable >= 0.4 && $actionable < 0.7) {\n            \"review\"\n          } else {\n            \"archive\"\n          }\n\n      # 4b. operational log: what this pipeline DECIDED, for the Expanso Cloud Logs\n      #     tab (and `expanso-cli job logs`). Ground rules:\n      #       - A selection, not a delivery. This runs BEFORE the output writes, so\n      #         a line says a destination was \"selected\" and the write is pending.\n      #         It never says written, delivered, kept or retained: at this point\n      #         none of that has happened yet. The framework's own DEBUG\n      #         \"Successfully wrote\" line is the write confirmation.\n      #       - Nothing is passed through raw. See the allowlists below. No message\n      #         text, no prompt, no Jev request or response body, no URL, no\n      #         credential, and the fingerprint only as a short hash (it is derived\n      #         from the message and can hold a username).\n      #       - Only the ROUTINE path is sampled. A bypassed record logs a\n      #         checkpoint on its fingerprint's first occurrence and every 250th\n      #         after: per fingerprint, by that fingerprint's own count, not a\n      #         global rate.\n      #       - Every NON-bypass selection is logged, judged (INFO) or fallback\n      #         (WARN), with no sampling. It has to be: the fingerprint erases\n      #         numbers, so \"GET /health 500\" shares a counter with the routine\n      #         \"GET /health 200\", and any occurrence-based sampling would silence\n      #         exactly the changed-value line worth seeing.\n      #       - Honest limit: this is sized for a synthetic demo, where non-routine\n      #         traffic is a few lines a second. With Jev unreachable every\n      #         non-routine record is a WARN. High-volume production traffic would\n      #         need a real rate cap, which needs state this pipeline does not keep.\n      #       - The summary is in the MESSAGE, because the Logs tab filters the line\n      #         by substring. Search \"triage\", \"fallback\", \"-> PAGE\", or an event hash.\n      #       - A fallback is WARN and is never worded as a judgment: no model\n      #         answered.\n      - label: build_log_fields\n        mapping: |\n          # Only values from closed sets, generated ids, numbers and hashes leave the\n          # node. service / level / id come from the log producer and team /\n          # severity come back from a model: all are arbitrary strings, so each is\n          # checked against a closed allowlist and anything else is replaced, never\n          # passed through. Ids and fingerprints are hashed unconditionally.\n          let occ = this.recurrence.occurrence.number().catch(0)\n          let fp = this.fingerprint.string().hash(\"sha256\").encode(\"hex\").slice(0, 12)\n          let lvl = if [\"DEBUG\", \"INFO\", \"WARN\", \"ERROR\"].contains(this.level) { this.level } else { \"other\" }\n          let svc = if [\"api\", \"worker\", \"cache\", \"deploy\", \"db\", \"edge\", \"infra\", \"net\", \"auth\"].contains(this.service) { this.service } else { \"other\" }\n          # The id is producer-supplied, so it is ALWAYS hashed: a pattern such as\n          # ^evt-... would still admit \"evt-alice-smith\". sha256 so the same 12 hex\n          # chars can be recomputed from a local receipt to correlate the two:\n          #   hashlib.sha256(record[\"id\"].encode()).hexdigest()[:12]\n          let eid = this.id.string().hash(\"sha256\").encode(\"hex\").slice(0, 12)\n          let tail = \" event=\" + $eid + \" fp=\" + $fp + \" occ=\" + $occ.string() + \" svc=\" + $svc + \" lvl=\" + $lvl\n          let a = this.jev.answers.or({})\n          let sev = if [\"info\", \"warning\", \"critical\", \"other\"].contains($a.severity.choice) { $a.severity.choice } else { \"invalid\" }\n          let team = if [\"backend\", \"infra\", \"data\", \"security\", \"other\"].contains($a.team.choice) { $a.team.choice } else { \"invalid\" }\n          let act = ($a.actionable.noul.number().catch(0) * 100).round() / 100\n          let conf = ($a.severity.confidence.number().catch(0) * 100).round() / 100\n          meta log_kind = if this.bypass {\n            if $occ == 1 || $occ % 250 == 0 { \"bypass\" } else { \"\" }\n          } else if this.jev_decision == \"held\" {\n            # one line when a record is FIRST held; its retries are not news\n            if this.held_attempts == 0 { \"held\" } else { \"\" }\n          } else if !this.jev_ok.or(false) {\n            \"fallback\"\n          } else {\n            \"judged\"\n          }\n          meta log_summary = if this.bypass {\n            \"triage bypass -> ARCHIVE selected, output pending: known-routine line, no model call (checkpoint: a fingerprint's first occurrence, then every 250th)\" + $tail\n          } else if this.jev_decision == \"held\" {\n            \"triage held -> HOLD selected, output pending: Jev gave no answer, nothing guessed; retrying every 2-4s, up to 15 attempts (severity-only baseline: \" + this.baseline + \")\" + $tail\n          } else if !this.jev_ok.or(false) {\n            \"triage fallback -> REVIEW selected, output pending: Jev gave no answer after \" + this.held_attempts.string() + \" attempts, nothing guessed (severity-only baseline: \" + this.baseline + \")\" + $tail\n          } else {\n            \"triage judged -> \" + this.jev_decision.uppercase() + \" selected, output pending: \" + (if this.held_attempts > 0 { \"released after \" + this.held_attempts.string() + \" held attempts; \" } else { \"\" }) + \"Jev reported actionable=\" + $act.string() + \" severity=\" + $sev + \" confidence=\" + $conf.string() + \" team=\" + $team + \" (severity-only baseline: \" + this.baseline + \")\" + $tail\n          }\n          meta log_event = $eid\n      - label: log_selection\n        switch:\n          - check: 'meta(\"log_kind\") == \"fallback\" || meta(\"log_kind\") == \"held\"'\n            processors:\n              - log:\n                  level: WARN\n                  message: '${! meta(\"log_summary\") }'\n                  fields_mapping: |\n                    root.stage = \"select\"\n                    root.outcome = meta(\"log_kind\") + \"_selected\"\n                    root.held_attempts = this.held_attempts\n                    root.destination = this.jev_decision\n                    root.baseline = this.baseline\n                    root.event_id = meta(\"log_event\")\n                    root.write_confirmed = false\n          - check: 'meta(\"log_kind\") == \"judged\" || meta(\"log_kind\") == \"bypass\"'\n            processors:\n              - log:\n                  level: INFO\n                  message: '${! meta(\"log_summary\") }'\n                  fields_mapping: |\n                    root.stage = \"select\"\n                    root.outcome = meta(\"log_kind\") + \"_\" + this.jev_decision + \"_selected\"\n                    root.destination = this.jev_decision\n                    root.baseline = this.baseline\n                    root.event_id = meta(\"log_event\")\n                    root.model_called = !this.bypass\n                    root.write_confirmed = false\n\n      # 5. record the decision (deterministic -- feeds future recurrence history).\n      #    Not while held: \"held\" is not a decision about the event, and it must\n      #    not show up in a fingerprint's history as if it were.\n      - label: record_decision\n        switch:\n          - check: 'this.jev_decision != \"held\"'\n            processors:\n            - branch:\n                request_map: |\n                  root = {\"fingerprint\": this.fingerprint, \"decision\": this.jev_decision}\n                processors:\n                  - http:\n                      url: http://127.0.0.1:8898/record\n                      verb: POST\n                      headers:\n                        Content-Type: application/json\n\n  output:\n    switch:\n      cases:\n        # HOLD. Jev did not answer, so the record is neither guessed nor dropped.\n        # First hold only: write one receipt, then fall through (`continue`) to...\n        - check: this.jev_decision == \"held\" && this.held_attempts == 0\n          continue: true\n          output:\n            file:\n              path: data/held.jsonl\n              codec: lines\n        # ...the loop: re-submit to this pipeline's own input with the attempt\n        # count raised. It waits at step 0, asks Jev again, and takes its real\n        # route on the pass where Jev answers. After 15 attempts the gate stops\n        # holding and sends it to review.\n        - check: this.jev_decision == \"held\"\n          output:\n            http_client:\n              url: http://127.0.0.1:${INGEST_PORT:8080}/logs\n              verb: POST\n              headers:\n                Content-Type: application/json\n              max_in_flight: 64\n            processors:\n              - mapping: |\n                  root = this\n                  root.held_attempts = this.held_attempts + 1\n        - check: this.jev_decision == \"page\"\n          output:\n            file:\n              path: data/page.jsonl\n              codec: lines\n        - check: this.jev_decision == \"notify\"\n          output:\n            file:\n              path: data/notify.jsonl\n              codec: lines\n        - check: this.jev_decision == \"review\"\n          output:\n            file:\n              path: data/review.jsonl\n              codec: lines\n        - check: \"true\"\n          output:\n            file:\n              path: data/archive.jsonl\n              codec: lines\n","type":"application/x-yaml"},{"name":"demos/01-log-triage/fixtures/recurrence.expected/archive.jsonl","text":"{\"baseline\": \"archive\", \"bypass\": true, \"fingerprint\": \"api::get /health # #ms\", \"held_attempts\": 0, \"id\": \"evt-000001\", \"jev_decision\": \"archive\", \"level\": \"INFO\", \"msg\": \"GET /health 200 2ms\", \"node_id\": \"fixture-node\", \"recurrence\": {\"occurrence\": 1, \"previous_decisions\": [], \"window_s\": 600}, \"routed_by\": \"expanso-bypass\", \"service\": \"api\", \"ts\": \"2026-10-05T09:00:01Z\"}\n{\"baseline\": \"archive\", \"bypass\": true, \"fingerprint\": \"api::get /metrics # #ms\", \"held_attempts\": 0, \"id\": \"evt-000002\", \"jev_decision\": \"archive\", \"level\": \"INFO\", \"msg\": \"GET /metrics 200 5ms\", \"node_id\": \"fixture-node\", \"recurrence\": {\"occurrence\": 1, \"previous_decisions\": [], \"window_s\": 600}, \"routed_by\": \"expanso-bypass\", \"service\": \"api\", \"ts\": \"2026-10-05T09:00:02Z\"}\n{\"baseline\": \"archive\", \"bypass\": true, \"fingerprint\": \"worker::cron heartbeat ok jobnightly-rollup\", \"held_attempts\": 0, \"id\": \"evt-000003\", \"jev_decision\": \"archive\", \"level\": \"INFO\", \"msg\": \"cron heartbeat ok job=nightly-rollup\", \"node_id\": \"fixture-node\", \"recurrence\": {\"occurrence\": 1, \"previous_decisions\": [], \"window_s\": 600}, \"routed_by\": \"expanso-bypass\", \"service\": \"worker\", \"ts\": \"2026-10-05T09:00:03Z\"}\n{\"baseline\": \"archive\", \"bypass\": true, \"fingerprint\": \"cache::cache hit rate #.# window#m\", \"held_attempts\": 0, \"id\": \"evt-000013\", \"jev_decision\": \"archive\", \"level\": \"INFO\", \"msg\": \"cache hit rate 0.94 window=5m\", \"node_id\": \"fixture-node\", \"recurrence\": {\"occurrence\": 1, \"previous_decisions\": [], \"window_s\": 600}, \"routed_by\": \"expanso-bypass\", \"service\": \"cache\", \"ts\": \"2026-10-05T09:00:13Z\"}\n{\"baseline\": \"archive\", \"bypass\": true, \"fingerprint\": \"deploy::rollout step #/# complete servicecheckout\", \"held_attempts\": 0, \"id\": \"evt-000015\", \"jev_decision\": \"archive\", \"level\": \"INFO\", \"msg\": \"rollout step 3/8 complete service=checkout\", \"node_id\": \"fixture-node\", \"recurrence\": {\"occurrence\": 1, \"previous_decisions\": [], \"window_s\": 600}, \"routed_by\": \"expanso-bypass\", \"service\": \"deploy\", \"ts\": \"2026-10-05T09:00:15Z\"}\n","type":"application/x-ndjson"},{"name":"demos/01-log-triage/fixtures/recurrence.expected/notify.jsonl","text":"{\"baseline\": \"notify\", \"bypass\": false, \"fingerprint\": \"auth::auth failed for user admin from #.#.#.#\", \"held_attempts\": 0, \"id\": \"evt-000008\", \"jev\": {\"answers\": {\"actionable\": {\"noul\": 0.75, \"type\": \"noul\"}, \"recurrence_concern\": {\"noul\": 0.92, \"type\": \"noul\"}, \"severity\": {\"choice\": \"warning\", \"confidence\": 0.92, \"probabilities\": {\"critical\": 0.027, \"info\": 0.027, \"other\": 0.027, \"warning\": 0.92}, \"type\": \"choice\"}, \"team\": {\"choice\": \"other\", \"confidence\": 0.35, \"probabilities\": {\"backend\": 0.02, \"data\": 0.02, \"infra\": 0.02, \"other\": 0.92, \"security\": 0.02}, \"type\": \"choice\"}}, \"model\": \"jev-mock\"}, \"jev_decision\": \"notify\", \"jev_ok\": true, \"level\": \"WARN\", \"msg\": \"auth failed for user admin from 10.0.9.12\", \"node_id\": \"fixture-node\", \"recurrence\": {\"occurrence\": 3, \"previous_decisions\": [\"review\", \"review\"], \"window_s\": 600}, \"routed_by\": \"jev\", \"service\": \"auth\", \"ts\": \"2026-10-05T09:00:08Z\"}\n{\"baseline\": \"notify\", \"bypass\": false, \"fingerprint\": \"auth::auth failed for user admin from #.#.#.#\", \"held_attempts\": 0, \"id\": \"evt-000009\", \"jev\": {\"answers\": {\"actionable\": {\"noul\": 0.9, \"type\": \"noul\"}, \"recurrence_concern\": {\"noul\": 0.92, \"type\": \"noul\"}, \"severity\": {\"choice\": \"warning\", \"confidence\": 0.92, \"probabilities\": {\"critical\": 0.027, \"info\": 0.027, \"other\": 0.027, \"warning\": 0.92}, \"type\": \"choice\"}, \"team\": {\"choice\": \"other\", \"confidence\": 0.35, \"probabilities\": {\"backend\": 0.02, \"data\": 0.02, \"infra\": 0.02, \"other\": 0.92, \"security\": 0.02}, \"type     el("span", { class: "where", text: "Stage " + (st.s + 1) + " of " + c.stages.length + ": " + c.stages[st.s].title }),
    el("button", { type: "button", disabled: st.s === c.stages.length - 1, onclick: () => step(1) }, "Next stage"),
    el("span", { class: "muted", text: "Left and Right arrow keys also page." }));
}
function ioBlock(title, value, marks) {
  const h = el("h4", {}, el("span", { text: title }));
  const [cb, cs] = copyButton("Copy", () => pretty(value), title.toLowerCase());
  h.append(el("span", { class: "row" }, cb, cs));
  return el("div", {}, h, typeof value === "string" ? el("pre", { text: value }) : jsonBlock(value, marks));
}
function renderPanel() {
  const c = cur(), rec = c.records[st.r], p = c.stages[st.s], N = c.stages.length;
  const states = rec.states; // index = number of processors already applied
  const last = N - 2;        // index of the last processor state
  panel.replaceChildren(el("h3", { text: "Stage " + (st.s + 1) + ": " + p.title }), el("p", {}, rich(p.text)));
  let input, output, io = el("div", { class: "io" });
  if (st.s === 0) {
    input = null; output = states[0];
    io.append(ioBlock("The record as it arrives", output, null));
  } else if (st.s === N - 1) {
    input = states[last]; output = null;
    io.append(ioBlock("The record that reaches the output", input, null));
    io.append(el("p", { class: "note", text: rec.destination
      ? "Written to the " + (c.queues[rec.destination] || rec.destination) + " queue (" + rec.destination + ")."
      : "Not written to any queue: an earlier stage removed this record." }));
  } else {
    input = states[st.s - 1]; output = states[st.s];
    io.classList.add("two");
    io.append(ioBlock("Goes in", input, null));
    if (output === undefined) io.append(el("p", { class: "note", text: "Nothing comes out: this stage removed the record." }));
    else io.append(ioBlock("Comes out", output, input && typeof input === "object" ? mark(output, input) : null));
    if (output !== undefined && JSON.stringify(output) === JSON.stringify(input)) {
      io.append(el("p", { class: "muted", text: "The message is unchanged by this stage." }));
    }
  }
  panel.append(io);
  if (output !== null && st.s > 0 && st.s < N - 1 && output !== undefined) {
    panel.append(el("p", { class: "legend", text: "In the right-hand block, + marks a field this stage added and ~ marks one it changed." }));
  }
  if (p.jev && rec.jev.length) {
    const call = rec.jev[rec.jev.length - 1];
    panel.append(el("h3", { text: "The call to Jev" }));
    const two = el("div", { class: "io two" });
    two.append(ioBlock("State sent to Jev", call.request, null));
    two.append(call.response && call.response.status
      ? el("div", {}, el("h4", {}, el("span", { text: "Jev's answer" })), el("p", { class: "note", text: "Jev did not answer (HTTP " + call.response.status + "). " + (rec.jev.length > 1 ? rec.jev.length + " attempts were made. " : "") + "The pipeline continued with an empty answer set." }))
      : ioBlock("Jev's answer", call.response, null));
    panel.append(two);
  } else if (p.jev) {
    panel.append(el("p", { class: "note", text: "Jev was not asked about this record: an earlier stage sent it straight to its destination with no model call." }));
  }
  if (p.source) {
    panel.append(el("h3", { text: "How this stage is written" }));
    const [cb, cs] = copyButton("Copy", () => p.source, "the stage source");
    panel.append(el("pre", { text: p.source }), el("div", { class: "row", style: "margin-top:8px" }, cb, cs));
  }
}
function render() { renderScenarios(); renderRecords(); renderBar(); renderPager(); renderPanel(); save(); }
function step(d) {
  const c = cur(), n = st.s + d;
  if (n < 0 || n >= c.stages.length) return;
  const y = window.scrollY, x = window.scrollX;
  st.s = n;
  renderBar(); renderPager(); renderPanel(); save();
  window.scrollTo(x, y); // paging replaces content in place; the page must not jump
}
document.addEventListener("keydown", (e) => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  const t = e.target;
  if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
  e.preventDefault();
  step(e.key === "ArrowRight" ? 1 : -1);
});
window.addEventListener("hashchange", () => { applyHash(); render(); });
render();

/* ---------- page: run and deploy ---------- */
function section(host, items) {
  for (const it of items) {
    host.append(el("h3", { text: it.title }));
    if (it.intro) host.append(el("p", {}, rich(it.intro)));
    for (const cmd of it.commands || []) {
      const wrap = el("div", { class: "cmd" });
      wrap.append(el("pre", { text: cmd }));
      const [cb, cs] = copyButton("Copy command", () => cmd, "the command");
      wrap.append(el("div", { class: "bar" }, cb, cs));
      host.append(wrap);
    }
    if (it.after) host.append(el("p", {}, rich(it.after)));
  }
}
section($("#run"), D.run);
section($("#deploy"), D.deploy);
for (const f of D.files) {
  const row = el("div", { class: "file" }, el("span", { class: "name", text: f.name }));
  const [db, ds] = downloadButton(f);
  const [cb, cs] = copyButton("Copy", () => f.text, f.name);
  row.append(el("span", { class: "row" }, db, ds, cb, cs));
  $("#files").append(row);
}
$("#foot").append(el("p", { text: D.provenance + " " }, D.report ? [el("a", { href: D.report, text: "Dated run report" }), "."] : ""));
</script>
</body>
</html>
