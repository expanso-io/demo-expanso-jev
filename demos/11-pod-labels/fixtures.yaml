apiVersion: v1
kind: Namespace
metadata:
  name: jev-label-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jev-visual-workload
  namespace: jev-label-demo
data:
  workload.py: |
    """Synthetic demo stimulus, emitted by a real pod's HTTP workload."""

    import json
    import sys
    import time
    import urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer

    SCENARIOS = {
        "checkout": {
            "event": "checkout_completed",
            "team": "payments",
            "routing_tier": "stable",
            "status": 200,
            "message": "Checkout request completed; eligible for stable checkout routing",
        },
        "recovery": {
            "event": "routing_recovered",
            "routing_tier": "stable",
            "status": 200,
            "message": "Health recovered; eligible for stable HTTP routing now",
        },
        "analytics": {
            "event": "batch_completed",
            "team": "data",
            "routing_tier": "batch",
            "status": 200,
            "message": "Batch analytics completed; batch routing eligible now",
        },
        "security": {
            "event": "routing_quarantined",
            "status": 403,
            "message": "Security policy denied traffic; no routing membership is eligible now",
        },
        "failure": {
            "event": "stable_traffic_denied",
            "routing_tier": "stable",
            "status": 503,
            "message": "Stable checkout traffic fails policy validation; remove stable routing membership",
        },
    }


    class Handler(BaseHTTPRequestHandler):
        def log_message(self, *args):
            pass

        def do_POST(self):
            scenario = self.path.removeprefix("/")
            if scenario not in SCENARIOS:
                self.send_error(404)
                return
            event = dict(SCENARIOS[scenario], at=time.time(), synthetic_stimulus=True)
            print(json.dumps(event), flush=True)
            payload = json.dumps(event).encode()
            self.send_response(200)
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)


    if __name__ == "__main__":
        if len(sys.argv) == 2 and sys.argv[1] in SCENARIOS:
            request = urllib.request.Request(
                "http://127.0.0.1:8080/" + sys.argv[1], data=b""
            )
            with urllib.request.urlopen(request, timeout=5) as response:
                print(response.read().decode())
        else:
            HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()

---
apiVersion: v1
kind: Pod
metadata:
  name: orders-api
  namespace: jev-label-demo
  labels:
    app: orders
    team: payments
  annotations:
    jev.expanso.io/fixture: visual-v1
    jev.expanso.io/workload-version: ordinary-v3
    jev.expanso.io/purpose: HTTP workload maintained by payments; current traffic eligibility comes from its latest relevant event.
spec:
  containers:
    - name: checkout
      image: python:3.13-alpine
      command: ["python", "-u", "/app/workload.py"]
      ports:
        - containerPort: 8080
      volumeMounts:
        - name: workload
          mountPath: /app
          readOnly: true
  volumes:
    - name: workload
      configMap:
        name: jev-visual-workload
---
