---
apiVersion: v1
kind: Pod
metadata:
  name: analytics-worker
  namespace: jev-label-demo
  labels:
    app: analytics
    team: data
  annotations:
    jev.expanso.io/fixture: visual-v1
    jev.expanso.io/workload-version: ordinary-v3
    jev.expanso.io/purpose: Analytics workload maintained by data; current traffic eligibility comes from its latest relevant event.
spec:
  containers:
    - name: checkout
      image: python:3.13-alpine
      command: ["python", "-u", "/app/workload.py"]
      ports:
        - containerPort: 8080
      volumeMounts:
        - name: workload
          mountPath: /app
          readOnly: true
  volumes:
    - name: workload
      configMap:
        name: jev-visual-workload
---
apiVersion: v1
kind: Service
metadata:
  name: stable-checkout
  namespace: jev-label-demo
spec:
  selector:
    app: checkout
    routing-tier: stable
  ports:
    - port: 80
      targetPort: 8080
