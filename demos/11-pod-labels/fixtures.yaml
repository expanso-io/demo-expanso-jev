apiVersion: v1
kind: Namespace
metadata:
  name: jev-label-demo
---
apiVersion: v1
kind: Pod
metadata:
  name: checkout-reference
  namespace: jev-label-demo
  labels:
    app: checkout
    team: payments
    routing-tier: stable
  annotations:
    jev.expanso.io/purpose: Checkout HTTP service, maintained by payments, eligible for stable checkout traffic.
spec:
  containers:
    - name: checkout
      image: nginx:1.27-alpine
---
apiVersion: v1
kind: Pod
metadata:
  name: checkout-new
  namespace: jev-label-demo
  labels:
    app: checkout
  annotations:
    jev.expanso.io/purpose: Checkout HTTP service, maintained by payments, eligible for stable checkout traffic.
spec:
  containers:
    - name: checkout
      image: nginx:1.27-alpine
---
apiVersion: v1
kind: Pod
metadata:
  name: analytics-reference
  namespace: jev-label-demo
  labels:
    app: analytics
    team: data
    routing-tier: batch
  annotations:
    jev.expanso.io/purpose: Analytics batch worker. Not a checkout service or stable HTTP traffic target.
spec:
  containers:
    - name: analytics
      image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Service
metadata:
  name: stable-checkout
  namespace: jev-label-demo
spec:
  selector:
    app: checkout
    routing-tier: stable
  ports:
    - port: 80
      targetPort: 80
