<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Pod signals · Expanso × Jev</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/web/style.css">
  <script src="/web/app.js" defer></script>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <h1>Pod signals</h1>
    <div class="connection"><span class="dot" id="connection-dot"></span><span id="connection" class="sr-only">Connecting</span></div>
    <span class="mode" id="mode">CONNECTING</span>
  </header>
  <section class="board" aria-label="Expanso reads pod logs, asks Jev, then requests Kubernetes updates">
    <div class="topology" id="topology">
      <svg class="wires" id="wires" aria-hidden="true">
        <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="context-stroke"/></marker></defs>
        <g id="injection-wires"></g>
        <path id="to-cloud" class="wire"/>
        <path id="to-jev" class="wire"/>
        <path id="from-jev" class="wire return"/>
        <path id="to-kube" class="wire return"/>
        <path id="to-pod" class="wire return"/>
        <g id="wire-labels"></g>
        <g id="packets"></g>
      </svg>
      <section class="event-source" id="event-source" aria-label="Workload events">
        <div class="event-tray" role="group" aria-label="Workload event">
          <button data-scenario="checkout" class="event-chip active" aria-pressed="true"><span class="event-icon">↗</span><b>Checkout</b></button>
          <button data-scenario="failure" class="event-chip" aria-pressed="false"><span class="event-icon">↯</span><b>Failure</b></button>
          <button data-scenario="analytics" class="event-chip" aria-pressed="false"><span class="event-icon">▥</span><b>Batch</b></button>
          <button data-scenario="recovery" class="event-chip" aria-pressed="false"><span class="event-icon">↻</span><b>Recovery</b></button>
          <button data-scenario="security" class="event-chip" aria-pressed="false"><span class="event-icon">◇</span><b>Security</b></button>
        </div>
      </section>
      <div class="cluster" id="cluster">
        <div class="pods" id="pods"><p class="empty">Connecting…</p></div>
        <div class="kube-node" id="kube-node"><span aria-hidden="true">⎈</span><b>Kubernetes</b></div>
      </div>
      <div class="processor cloud-node" id="cloud-node" aria-label="Expanso Cloud">
        <img class="expanso-logo" src="/assets/expanso-logo-full-violet.svg" alt="Expanso">
        <h2>Cloud</h2><span class="node-status" id="cloud-status">UNKNOWN</span>
      </div>
      <div class="processor jev-node" id="jev-node" aria-label="Jev by TypeSafe">
        <img class="typesafe-logo" src="/assets/typesafe-mark.png" alt="TypeSafe">
        <h2>Jev <small>by TypeSafe</small></h2><span class="node-status" id="jev-status">—</span>
      </div>
    </div>
  </section>
  <footer><span class="timing" id="timing">—</span><button id="details-toggle" aria-expanded="false" aria-controls="runtime-details">Details</button></footer>
  <section id="runtime-details" class="runtime-details" hidden>
    <div class="result-bar" aria-live="polite"><span id="result-mark"></span><div><b id="result-title">Ready</b><span id="result-detail"></span></div></div>
    <section class="label-catalog" aria-label="Available labels"><h2>Available labels</h2><div id="available-labels"></div></section>
    <section class="evidence">
      <div class="log-panel"><div class="panel-heading"><h2>Pod logs <span id="selected-name"></span></h2></div><div class="log-lines" id="logs"></div></div>
      <div class="decision-panel"><div class="panel-heading"><h2>Decisions</h2><span class="micro" id="event-count">0 EVENTS</span></div><ol id="trail"></ol></div>
    </section>
    <dl id="runtime-fields"></dl>
    <div hidden><span id="cluster-name"></span><span id="namespace"></span><span id="node-name"></span><span id="pod-count"></span><span id="activity"></span><span id="cloud-detail"></span></div>
  </section>
  <p id="error" role="alert" hidden></p>
</main>
</body>
</html>
