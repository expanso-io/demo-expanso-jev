name: jev-pod-labels
namespace: demo
type: pipeline
description: Cloud-driven Kubernetes label discovery, Jev judgment and signal-based undo.
selector:
  match_labels:
    demo: jev-pod-labels
config:
  input:
    http_client:
      url: http://127.0.0.1:8901/next-event
      verb: POST
      headers:
        Content-Type: application/json
        Authorization: 'Bearer ${POD_LABEL_TOKEN}'
      timeout: 30s
      retries: 0
      stream:
        enabled: false
  pipeline:
    threads: 1
    processors:
      - try:
          - http:
              url: http://127.0.0.1:8901/candidates
              verb: POST
              headers:
                Content-Type: application/json
                Authorization: 'Bearer ${POD_LABEL_TOKEN}'
              timeout: 30s
              retries: 0
          - unarchive:
              format: json_array
          - mapping: |
              root = {"id": this.id}
          - http:
              url: http://127.0.0.1:8901/judge
              verb: POST
              headers:
                Content-Type: application/json
                Authorization: 'Bearer ${POD_LABEL_TOKEN}'
              timeout: 35s
              retries: 0
          - http:
              url: http://127.0.0.1:8901/apply
              verb: POST
              headers:
                Content-Type: application/json
                Authorization: 'Bearer ${POD_LABEL_TOKEN}'
              timeout: 30s
              retries: 0
      - catch:
          - mapping: |
              root = {"result": "held", "reason": "adapter_or_jev_error"}
  output:
    stdout:
      codec: lines
