name: jev-pod-labels
namespace: demo
type: pipeline
description: Cloud-driven Kubernetes label discovery, Jev judgment and signal-based undo.
selector:
  match_labels:
    demo: jev-pod-labels
config:
  input:
    broker:
      inputs:
        - label: next_event
          http_client:
            url: http://127.0.0.1:${POD_LABEL_PORT:8901}/next-event
            verb: POST
            headers:
              Content-Type: application/json
              Authorization: 'Bearer ${POD_LABEL_TOKEN:unset}'
            timeout: 30s
            retries: 0
            stream:
              enabled: false
        - label: expire_tick
          generate:
            interval: 250ms
            mapping: 'root = {}'
          processors:
            - try:
                - http:
                    url: http://127.0.0.1:${POD_LABEL_PORT:8901}/expire-labels
                    verb: POST
                    headers:
                      Content-Type: application/json
                      Authorization: 'Bearer ${POD_LABEL_TOKEN:unset}'
                    timeout: 10s
                    retries: 0
            - mapping: 'root = deleted()'
        - label: routine_tick
          generate:
            interval: 400ms
            mapping: 'root = {}'
          processors:
            - try:
                - http:
                    url: http://127.0.0.1:${POD_LABEL_PORT:8901}/routine
                    verb: POST
                    headers:
                      Content-Type: application/json
                      Authorization: 'Bearer ${POD_LABEL_TOKEN:unset}'
                    timeout: 10s
                    retries: 0
            # This branch ends here, before the serial Jev decision path.
            - mapping: 'root = deleted()'
  pipeline:
    threads: 1
    processors:
      - label: decide_and_apply
        try:
          - label: candidates
            http:
              url: http://127.0.0.1:${POD_LABEL_PORT:8901}/candidates
              verb: POST
              headers:
                Content-Type: application/json
                Authorization: 'Bearer ${POD_LABEL_TOKEN:unset}'
              timeout: 30s
              retries: 0
          - label: split_candidates
            unarchive:
              format: json_array
          - label: pick_id
            mapping: |
              root = {"id": this.id}
          - label: judge
            http:
              url: http://127.0.0.1:${POD_LABEL_PORT:8901}/judge
              verb: POST
              headers:
                Content-Type: application/json
                Authorization: 'Bearer ${POD_LABEL_TOKEN:unset}'
              timeout: 35s
              retries: 0
          - label: apply
            http:
              url: http://127.0.0.1:${POD_LABEL_PORT:8901}/apply
              verb: POST
              headers:
                Content-Type: application/json
                Authorization: 'Bearer ${POD_LABEL_TOKEN:unset}'
              timeout: 110s
              retries: 0
      - label: hold_on_error
        catch:
          - mapping: |
              root = {"result": "held", "reason": "adapter_or_jev_error"}
  output:
    label: receipt
    stdout:
      codec: lines
