name: expanso-edge-categorization-sensor-triage
type: pipeline
description: Sensor anomaly triage with Expanso Edge Categorization — every reading is judged against its baseline in context. Real anomalies dispatch maintenance with a context packet; routine telemetry rolls into aggregates.
namespace: production
labels:
  category: data-routing
  pattern: ai-decision
  model: expanso-edge-categorization

config:
  input:
    http_server:
      address: "${INGEST_ADDRESS:127.0.0.1:8080}"
      path: /readings
      allowed_verbs: ["POST"]

  pipeline:
    processors:
      - label: parse_body
        mapping: |
          # http_server already parses JSON bodies; only parse raw strings
          root = if this.type() == "string" { this.parse_json() } else { this }

      # Attach each sensor's normal operating baseline so Jev judges
      # deviation in context, not raw values (the baseline is embedded here; a cache lookup works the same way)
      - label: stamp_received
        mapping: |
          root = this
          root.baseline = {
            "temp_c_max": 85,
            "vibration_mm_s_max": 4.5,
            "note": "Values above these sustained for 5+ minutes are abnormal for this asset class"
          }
          root.received_at = now()

      # ── Ask the categorization model ──
      - label: start_timer
        mutation: |
          meta categorization_start = timestamp_unix_milli()

      - label: ask_categorization
        branch:
          request_map: |
            root = {
              "state": this.string(),
              "model": "jev-latest",
              "questions": {
                "anomaly": {
                  "type": "score",
                  "instructions": "How anomalous is this sensor reading relative to its baseline?",
                  "criteria": [
                    "Normal operation",
                    "Slightly unusual, watch",
                    "Concerning deviation",
                    "Severe anomaly",
                    "Critical failure signature"
                  ]
                },
                "dispatch": {
                  "type": "noul",
                  "instructions": "Should a maintenance technician be dispatched based on this reading?"
                }
              }
            }
          processors:
            - http:
                url: "${EDGE_CATEGORIZATION_API_URL:http://127.0.0.1:8099/v1/systemone}"
                verb: POST
                headers:
                  Content-Type: application/json
                  Authorization: "Bearer ${TYPESAFE_API_KEY:unset}"
                timeout: 2s
                retries: 1
            - catch:
              - mapping: |
                  root = {"answers": {}, "model": "categorization-unavailable"}
          result_map: |
            root.categorization = {
              "answers": this.answers,
              "model": this.model.or("jev-latest"),
              "ms": timestamp_unix_milli() - metadata("categorization_start")
            }

      # ── Confidence-gated cascade ──
      - label: route_decision
        mapping: |
          root = this
          let anomaly = this.categorization.answers.anomaly.score.or(0)
          let dispatch = this.categorization.answers.dispatch.noul.or(0)
          # When Jev did not answer, flag the reading for a person rather than roll it up.
          let categorization_up = this.categorization.model.or("") != "categorization-unavailable"

          root.categorization_decision = if $dispatch >= 0.8 {
            "dispatch"
          } else if !$categorization_up || $anomaly >= 2 {
            "flag"
          } else {
            "rollup"
          }

  output:
    broker:
      pattern: fan_out
      outputs:
        - label: echo_stdout
          stdout:
            codec: lines
        - label: by_decision
          switch:
            cases:
              - check: this.categorization_decision == "dispatch"
                output:
                  label: dispatch
                  file:
                    path: ./data/expanso-edge-categorization-sensor-triage/dispatch-${! now().ts_format("2006-01-02") }.jsonl
                    codec: lines
              - check: this.categorization_decision == "flag"
                output:
                  label: flagged
                  file:
                    path: ./data/expanso-edge-categorization-sensor-triage/flagged-${! now().ts_format("2006-01-02") }.jsonl
                    codec: lines
              - check: "true"
                output:
                  label: rollup
                  file:
                    path: ./data/expanso-edge-categorization-sensor-triage/rollup-${! now().ts_format("2006-01-02") }.jsonl
                    codec: lines
