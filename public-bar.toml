# Generated by tools/build-explorers.py from the demos' fixture.json files.
version = 1

[repository]
name = "demo-expanso-jev"
published = true

[web]
document = "index.html"
explanation_selector = "#explanation"
explorer_selector = "#explorer"
run_selector = "#run"
deploy_selector = "#deploy"

[browser]
url = "http://127.0.0.1:8777/"
ready_url = "http://127.0.0.1:8777/"
start_command = ["python3", "tools/serve.py", "static", "8777"]
stop_command = ["python3", "tools/serve.py", "stop", "8777"]
theme_toggle_selector = "#theme-toggle"
stage_selector = "[data-stage-id]"
current_stage_selector = "[data-stage-id][aria-current=\"step\"]"
scroll_anchor_selector = "#stage-panel"
json_selectors = ["#stage-input", "#stage-output"]

[[browser.controls]]
id = "copy-stage-input"
kind = "copy"
selector = "#copy-stage-input"
feedback_selector = "#copy-stage-input-status"
success_text = "Copied"
failure_text = "Copy failed"

[[browser.controls]]
id = "download-pipeline"
kind = "download"
selector = "#download-pipeline"
feedback_selector = "#download-pipeline-status"
success_text = "Download started"
failure_text = "Download failed"
failure_url_pattern = "**/pipeline*.yaml"

[[services]]
id = "jev-responder"
command = ["python3", "shared/jev-mock-server.py"]
ready_url = "http://127.0.0.1:8099/health"
stop_command = ["python3", "tools/serve.py", "stop", "8099"]

[[services]]
id = "recurrence-counter"
command = ["python3", "demos/01-log-triage/counter.py"]
ready_url = "http://127.0.0.1:8898/health"
stop_command = ["python3", "tools/serve.py", "stop", "8898"]

[[services]]
id = "recorded-adapter"
command = ["python3", "tools/serve.py", "pods", "8901"]
ready_url = "http://127.0.0.1:8901/health"
stop_command = ["python3", "tools/serve.py", "stop", "8901"]

